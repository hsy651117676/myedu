{% extends "layout/base.html" %}
{% block title %}忘记密码{% endblock %}

{% block content %}
<div id="app" style="max-width:450px; margin:50px auto;">
  <h2 style="text-align:center; margin-bottom:20px;">忘记密码</h2>

  <el-form ref="formRef" :model="form" @submit.prevent="submit">
    {% csrf_token %}

    <el-form-item label="用户名">
      <el-input v-model="form.username" placeholder="请输入用户名"></el-input>
    </el-form-item>
    <el-form-item label="邮箱">
      <el-input v-model="form.email" placeholder="请输入邮箱"></el-input>
    </el-form-item>
    <el-form-item label="验证码">
      <div style="display:flex;gap:10px;">
        <el-input v-model="form.code" placeholder="6位验证码"></el-input>
        <el-button @click="sendCode" :disabled="sending">
          [[ sending ? countdown + '秒后重发' : '发送验证码' ]]
        </el-button>
      </div>
    </el-form-item>
    <el-form-item label="新密码">
      <el-input v-model="form.password1" type="password" show-password></el-input>
    </el-form-item>
    <el-form-item label="确认密码">
      <el-input v-model="form.password2" type="password" show-password></el-input>
    </el-form-item>
    <el-form-item>
      <el-button type="primary" native-type="submit" style="width:100%;">重置密码</el-button>
    </el-form-item>
  </el-form>
</div>

<script>
const { createApp, reactive, ref } = Vue;
const { ElMessage } = ElementPlus;

const app = createApp({
  setup() {
    const form = reactive({ username: '', email: '', code: '', password1: '', password2: '' });
    const sending = ref(false);
    const countdown = ref(60);
    let timer = null;

    const getCSRFToken = () => {
      const token = document.querySelector('[name=csrfmiddlewaretoken]');
      return token ? token.value : '';
    };

    const sendCode = async () => {
      if (!form.username || !form.email) {
        ElMessage.warning('请先输入用户名和邮箱');
        return;
      }

      const fd = new FormData();
      fd.append('username', form.username);
      fd.append('email', form.email);
      fd.append('csrfmiddlewaretoken', getCSRFToken());

      const res = await fetch('/send-reset-code/', { method: 'POST', body: fd });
      const data = await res.json();
      ElMessage[data.code === 200 ? 'success' : 'error'](data.msg);

      if (data.code === 200) {
        sending.value = true;
        countdown.value = 60;
        timer = setInterval(() => {
          countdown.value--;
          if (countdown.value <= 0) {
            clearInterval(timer);
            sending.value = false;
            countdown.value = 60;
          }
        }, 1000);
      }
    };

    const submit = async () => {
      if (!form.username || !form.email || !form.code || !form.password1 || !form.password2) {
        ElMessage.warning('请填写完整信息');
        return;
      }

      try {
        const res = await fetch('/forgot-pwd/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCSRFToken()
          },
          body: JSON.stringify(form)
        });
        const data = await res.json();
        if (data.code === 200) {
          ElMessage.success(data.msg);
          setTimeout(() => location.href = '/login/', 1500);
        } else {
          ElMessage.error(data.msg);
        }
      } catch (e) {
        ElMessage.error('请求失败，请稍后重试');
      }
    };

    return { form, sending, countdown, sendCode, submit };
  }
});

app.config.compilerOptions.delimiters = ['[[', ']]'];
app.use(ElementPlus).mount('#app');
</script>
{% endblock %}
