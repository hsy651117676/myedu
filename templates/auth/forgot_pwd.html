{% extends "layout/base.html" %}
{% block title %}忘记密码{% endblock %}

{% block content %}
<div id="app" style="max-width:450px; margin:50px auto;">
  <h2 style="text-align:center; margin-bottom:20px;">忘记密码</h2>

  <el-form @submit.prevent="submit">
    {% csrf_token %}

    <el-form-item label="用户名">
      <el-input v-model="form.username" placeholder="请输入用户名"></el-input>
    </el-form-item>
    <el-form-item label="邮箱">
      <el-input v-model="form.email" placeholder="请输入邮箱"></el-input>
    </el-form-item>
    <el-form-item label="验证码">
      <div style="display:flex;gap:10px;">
        <el-input v-model="form.code" placeholder="6位验证码"></el-input>
        <el-button @click="sendCode" :disabled="sending">
          <span v-if="sending">60秒后重发</span>
          <span v-else>发送验证码</span>
        </el-button>
      </div>
    </el-form-item>
    <el-form-item label="新密码">
      <el-input v-model="form.password1" type="password" show-password></el-input>
    </el-form-item>
    <el-form-item label="确认密码">
      <el-input v-model="form.password2" type="password" show-password></el-input>
    </el-form-item>
    <el-form-item>
      <el-button type="primary" style="width:100%">重置密码</el-button>
    </el-form-item>
  </el-form>
</div>

<script>
const { createApp, reactive, ref } = Vue;
const { ElMessage } = ElementPlus;

createApp({
  setup() {
    const form = reactive({ username: '', email: '', code: '', password1: '', password2: '' });
    const sending = ref(false);
    let time = 60, timer = null;

    const sendCode = async () => {
      const fd = new FormData();
      fd.append('username', form.username);
      fd.append('email', form.email);
      fd.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);

      const res = await fetch('/send-reset-code/', { method: 'POST', body: fd });
      const data = await res.json();
      ElMessage[data.code === 200 ? 'success' : 'error'](data.msg);

      if (data.code === 200) {
        sending.value = true;
        timer = setInterval(() => {
          time--;
          if (time <= 0) {
            clearInterval(timer);
            sending.value = false;
            time = 60;
          }
        }, 1000);
      }
    };

    const submit = async () => {
      const res = await fetch('/forgot-pwd/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: JSON.stringify(form)
      });
      const data = await res.json();
      if (data.code === 200) {
        ElMessage.success(data.msg);
        setTimeout(() => location.href = '/login/', 1000);
      } else {
        ElMessage.error(data.msg);
      }
    };

    return { form, sending, sendCode, submit };
  }
}).use(ElementPlus).mount('#app');
</script>
{% endblock %}
