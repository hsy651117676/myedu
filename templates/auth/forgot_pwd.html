{% extends "layout/base.html" %}

{% block title %}忘记密码{% endblock %}

{% block content %}
<div id="app" style="max-width:450px; margin:0 auto;">
  <h2 style="text-align:center;">忘记密码</h2>

  <el-form ref="formRef" :model="form" :rules="rules" @submit.prevent="submit" label-width="80px">
    <el-form-item label="用户名" prop="username">
      <el-input v-model="form.username" placeholder="请输入用户名"></el-input>
    </el-form-item>

    <el-form-item label="邮箱" prop="email">
      <el-input v-model="form.email" placeholder="请输入邮箱"></el-input>
    </el-form-item>

    <el-form-item label="验证码" prop="code">
      <div style="display:flex;gap:10px;">
        <el-input v-model="form.code" placeholder="验证码"></el-input>
        <el-button @click="sendCode" :disabled="sending">
          <span v-if="sending">{% verbatim %}{{ time }}{% endverbatim %}秒后重发</span>
          <span v-else>发送验证码</span>
        </el-button>
      </div>
    </el-form-item>

    <el-form-item label="新密码" prop="password1">
      <el-input type="password" v-model="form.password1" placeholder="新密码≥6位"></el-input>
    </el-form-item>

    <el-form-item label="确认密码" prop="password2">
      <el-input type="password" v-model="form.password2" placeholder="确认新密码"></el-input>
    </el-form-item>

    <el-form-item>
      <el-button type="primary" style="width:100%" native-type="submit">重置密码</el-button>
    </el-form-item>
  </el-form>
</div>

<script>
const { createApp } = Vue;
const { ElMessage } = ElementPlus;

createApp({
  data() {
    return {
      form: { username:'', email:'', code:'', password1:'', password2:'' },
      rules: {
        username: [{ required:true, message:'请输入用户名', trigger:'blur' }],
        email: [
          { required:true, message:'请输入邮箱', trigger:'blur' },
          { type:'email', message:'邮箱格式不正确', trigger:'blur' }
        ],
        code: [{ required:true, message:'请输入验证码', trigger:'blur' }],
        password1: [
          { required:true, message:'请输入新密码', trigger:'blur' },
          { min:6, message:'密码至少6位', trigger:'blur' }
        ],
        password2: [
          { required:true, message:'请确认密码', trigger:'blur' },
          { validator: (r, v) => v === this.form.password1, message:'两次密码不一致', trigger:'blur' }
        ]
      },
      sending: false,
      time: 60,
      timer: null
    }
  },
  methods: {
    async sendCode() {
      if (this.sending) return;
      try { await this.$refs.formRef.validateField(['username','email']); }
      catch(e) { return; }

      this.sending = true;
      this.time = 60;

      const res = await fetch('/send-reset-code/', {
        method: 'POST',
        headers: {
          'Content-Type':'application/x-www-form-urlencoded',
          'X-CSRFToken':'{{ csrf_token }}'
        },
        body: new URLSearchParams(this.form)
      });
      const data = await res.json();

      if (data.code === 200) {
        ElMessage.success(data.msg);
        this.timer = setInterval(() => {
          this.time--;
          if (this.time <= 0) {
            clearInterval(this.timer);
            this.sending = false;
            this.time = 60;
          }
        }, 1000);
      } else {
        ElMessage.error(data.msg);
        this.sending = false;
      }
    },
    async submit() {
      const valid = await this.$refs.formRef.validate();
      if (!valid) return;

      const res = await fetch('/forgot-pwd/', {
        method: 'POST',
        headers: {
          'Content-Type':'application/json',
          'X-CSRFToken':'{{ csrf_token }}'
        },
        body: JSON.stringify(this.form)
      });
      const data = await res.json();
      if (data.code === 200) {
        ElMessage.success('密码重置成功');
        setTimeout(()=>location.href='/login/',1000);
      } else {
        ElMessage.error(data.msg);
      }
    }
  }
}).use(ElementPlus).mount('#app')
</script>
{% endblock %}
