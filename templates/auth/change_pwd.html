{% extends 'layout/base.html' %}

{% block title %}修改密码{% endblock %}

{% block content %}
<style>
.change-box {
    max-width: 450px;
    margin: 80px auto;
    padding: 30px;
    border: 1px solid #eee;
    border-radius: 10px;
}
</style>

<div class="change-box" id="app">
  <h3 style="text-align:center; margin-bottom:30px">修改密码</h3>

  <el-form>
    {% csrf_token %}

    <el-form-item label="旧密码">
      <el-input v-model="old_pwd" type="password" show-password></el-input>
    </el-form-item>

    <el-form-item label="新密码">
      <el-input v-model="new1" type="password" show-password></el-input>
    </el-form-item>

    <el-form-item label="确认新密码">
      <el-input v-model="new2" type="password" show-password></el-input>
    </el-form-item>

    <el-form-item>
      <el-button type="primary" @click="submit" style="width:100%">确认修改</el-button>
    </el-form-item>
  </el-form>
</div>

<script>
const { createApp, ref } = Vue
const { ElMessage } = ElementPlus

createApp({
  setup() {
    const old_pwd = ref('')
    const new1 = ref('')
    const new2 = ref('')

    async function submit() {
      // 简单校验
      if (!old_pwd.value) {
        ElMessage.warning('请输入旧密码')
        return
      }
      if (!new1.value) {
        ElMessage.warning('请输入新密码')
        return
      }
      if (new1.value !== new2.value) {
        ElMessage.warning('两次输入的新密码不一致')
        return
      }

      try {
        const res = await fetch(window.location.pathname, {
          method: 'POST',
          headers: {
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
          },
          body: new URLSearchParams({
            old_pwd: old_pwd.value,
            new_pwd1: new1.value,
            new_pwd2: new2.value
          })
        })

        const data = await res.json()
        if (data.code === 200) {
          ElMessage.success(data.msg)
          setTimeout(() => {
            location.href = '/'
          }, 1000)
        } else {
          ElMessage.error(data.msg)
        }
      } catch (e) {
        ElMessage.error('请求失败，请稍后重试')
      }
    }

    return {
      old_pwd,
      new1,
      new2,
      submit
    }
  }
}).use(ElementPlus).mount('#app')
</script>
{% endblock %}
