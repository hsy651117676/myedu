<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户登录</title>
  <link rel="stylesheet" href="/static/lib/element-plus.css">
  <script src="/static/lib/vue.global.prod.js"></script>
  <script src="/static/lib/element-plus.min.js"></script>
  <script src="/static/lib/element-plus-icons.min.js"></script>
  <script src="/static/lib/element-plus-zh-cn.min.js"></script>
  <link rel="shortcut icon" href="/static/favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-box {
      width: 420px;
      padding: 40px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .login-title {
      text-align: center;
      margin-bottom: 30px;
      color: #303133;
      font-size: 24px;
      font-weight: bold;
    }

    .captcha-img {
      height: 40px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid #dcdfe6;
      transition: all 0.3s;
    }

    .captcha-img:hover {
      border-color: #409EFF;
      transform: scale(1.05);
    }

    .el-form-item {
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-box" id="app">
    <div v-if="showCertWarning" style="background:#fff8e1;border:1px solid #ffc107;padding:12px;margin-bottom:20px;border-radius:4px;font-size:13px;color:#795548;">
      ⚠️ 浏览器提示"不安全"？请安装根证书<br>
      <a href="/static/ca.crt" download style="color:#409EFF;">📥 点击下载 CA 根证书</a>
    </div>
    <div class="login-title">系统登录</div>

    <el-form ref="loginForm" :model="form" :rules="rules" @submit.prevent="handleLogin">
      {% csrf_token %}

      <el-form-item prop="username">
        <el-input 
          v-model="form.username" 
          placeholder="请输入用户名"
          prefix-icon="el-icon-user"
          size="large">
        </el-input>
      </el-form-item>

      <el-form-item prop="password">
        <el-input 
          v-model="form.password" 
          type="password" 
          placeholder="请输入密码"
          prefix-icon="el-icon-lock"
          show-password
          size="large"
          @keyup.enter="handleLogin">
        </el-input>
      </el-form-item>

      <el-form-item prop="captcha">
        <div style="display: flex; gap: 12px; align-items: center;">
          <el-input 
            v-model="form.captcha" 
            placeholder="验证码"
            prefix-icon="el-icon-key"
            maxlength="4"
            size="large"
            style="flex: 1;">
          </el-input>
          <img 
            class="captcha-img" 
            :src="captchaUrl" 
            @click="refreshCaptcha"
            title="点击刷新验证码">
        </div>
      </el-form-item>

      <el-form-item>
        <el-checkbox v-model="form.isArchiveUser" style="font-size:13px;">
          档案系统用户登录
        </el-checkbox>
      </el-form-item>
      <el-form-item>
        <el-button 
          type="primary" 
          native-type="submit" 
          size="large"
          :loading="loading"
          style="width: 100%;">
          [[ loading ? '登录中...' : '登 录' ]]
        </el-button>
      </el-form-item>

      <div style="text-align: center; color: #909399; font-size: 14px;">
        <a href="/register/" style="margin-right: 20px; color: #409EFF;">注册账号</a>
        <span style="margin: 0 10px;">|</span>
        <a href="/forgot-pwd/" style="color: #409EFF;">忘记密码</a>
      </div>
    </el-form>
  </div>
</div>

<script>
// 如果在 iframe 中，跳出到父窗口
if (window.top !== window.self) {
  window.top.location.href = window.location.href;
}

const { createApp, ref, reactive } = Vue;
const { ElMessage } = ElementPlus;

const app = createApp({
  setup() {
    const form = reactive({
      username: '',
      password: '',
      captcha: '',
      isArchiveUser: true,
    });

    const showCertWarning = ref(false);
    const loading = ref(false);
    const captchaUrl = ref('/captcha/?' + Date.now());

    // 检测证书
    const checkCert = async () => {
      try {
        await fetch('/static/favicon.ico', { cache: 'reload' });
        showCertWarning.value = false;
      } catch (e) {
        showCertWarning.value = true;
      }
    };
    checkCert();

    const rules = {
      username: [
        { required: true, message: '请输入用户名', trigger: 'blur' }
      ],
      password: [
        { required: true, message: '请输入密码', trigger: 'blur' }
      ],
      captcha: [
        { required: true, message: '请输入验证码', trigger: 'blur' },
        { min: 4, max: 4, message: '验证码长度为4位', trigger: 'blur' }
      ]
    };

    const getCSRFToken = () => {
      const token = document.querySelector('[name=csrfmiddlewaretoken]');
      return token ? token.value : '';
    };

    const refreshCaptcha = () => {
      captchaUrl.value = '/captcha/?' + Date.now();
    };

    const handleLogin = async () => {
      loading.value = true;
      try {
        const formData = new FormData();
        formData.append('username', form.username);
        formData.append('password', form.password);
        formData.append('captcha', form.captcha);

        const csrfToken = getCSRFToken();
        if (csrfToken) {
          formData.append('csrfmiddlewaretoken', csrfToken);
        }
        formData.append('is_archive_user', form.isArchiveUser ? '1' : '0');

        const response = await fetch('/login/', {
          method: 'POST',
          body: formData,
          headers: {
            'X-Requested-With': 'XMLHttpRequest'
          }
        });

        if (response.redirected) {
          window.location.href = response.url;
          return;
        }

        refreshCaptcha();
        form.captcha = '';

        const text = await response.text();

        if (text.includes('login-box') || text.includes('login-container')) {
          ElMessage.error('用户名或密码错误');
        } else {
          window.location.reload();
        }
      } catch (error) {
        ElMessage.error('登录失败，请稍后重试');
        refreshCaptcha();
      } finally {
        loading.value = false;
      }
    };

    return {
      form,
      rules,
      loading,
      captchaUrl,
      showCertWarning,
      refreshCaptcha,
      handleLogin
    };
  }
});

app.config.compilerOptions.delimiters = ['[[', ']]'];
app.use(ElementPlus).mount('#app');
</script>
</body>
</html>
