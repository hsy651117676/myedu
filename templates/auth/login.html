{% extends 'layout/base.html' %}

{% block title %}登录{% endblock %}

{% block content %}
<style>
.login-box {
  max-width: 400px;
  margin: 80px auto;
  padding: 30px;
  border: 1px solid #eee;
  border-radius: 10px;
  background: #fff;
}
.captcha-img {
  height: 38px;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid #dcdfe6;
}
</style>

<div class="login-box" id="app">
  <h3 style="text-align:center; margin-bottom:25px">用户登录</h3>

  <el-form @submit.prevent="submit">
    {% csrf_token %}

    <el-form-item label="用户名">
      <el-input v-model="form.username" placeholder="请输入用户名"></el-input>
    </el-form-item>

    <el-form-item label="密码">
      <el-input v-model="form.password" type="password" placeholder="请输入密码" show-password></el-input>
    </el-form-item>

    <el-form-item label="验证码">
      <div style="display: flex; gap:10px; align-items:center">
        <el-input v-model="form.captcha" placeholder="请输入验证码" maxlength="4"></el-input>
        <img class="captcha-img" :src="captchaUrl" @click="refreshCaptcha">
      </div>
    </el-form-item>

    <el-form-item>
      <el-button type="primary" native-type="submit" style="width:100%">登录</el-button>
    </el-form-item>

    <div style="text-align:center; margin-top:10px">
      <a href="/register/" style="margin-right:15px">注册账号</a>
      <a href="/forgot-pwd/">忘记密码</a>
    </div>
  </el-form>
</div>

<script>
if (window.top !== window.self) {
  window.top.location.href = window.location.href;
}

const { createApp, reactive, ref } = Vue;
const { ElMessage } = ElementPlus;

createApp({
  setup() {
    const form = reactive({
      username: '',
      password: '',
      captcha: ''
    });

    // 验证码地址
    const captchaUrl = ref('/captcha?' + Math.random());

    // 刷新验证码
    function refreshCaptcha() {
      captchaUrl.value = '/captcha?' + Math.random();
    }

    // 登录：只发请求，完全交给后端验证
    async function submit() {
      const fd = new FormData();
      fd.append('username', form.username);
      fd.append('password', form.password);
      fd.append('captcha', form.captcha);
      fd.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);

      const res = await fetch('/login/', {
        method: 'POST',
        body: fd
      });

      // 关键：后端返回页面，说明验证失败
      if (res.redirected) {
        location.href = res.url;
        return;
      }
      
      ElMessage.error('用户名/密码/验证码错误');
      refreshCaptcha();
    }

    return {
      form,
      captchaUrl,
      refreshCaptcha,
      submit
    };
  }
}).use(ElementPlus).mount('#app');
</script>
{% endblock %}
