{% extends "layout/base.html" %}
{% block content %}
<div id="app" style="padding:10px;height:100vh;display:flex;flex-direction:column;">
  <el-collapse v-model="activeName" accordion style="margin-bottom:10px;">
    <el-collapse-item title="查询条件" name="1">
      <el-card>
        <el-form :inline="true" :model="q" label-width="80px">
          <el-form-item label="人员姓名"><el-input v-model="q.name" style="width:200px"></el-input></el-form-item>
          <el-form-item label="身份证号"><el-input v-model="q.idCard" style="width:220px"></el-input></el-form-item>
          <el-form-item label="家庭住址"><el-input v-model="q.address" style="width:280px"></el-input></el-form-item>
          <el-form-item>
            <el-button type="primary" @click="query">查询</el-button>
            <el-button @click="reset">重置</el-button>
          </el-form-item>
        </el-form>
      </el-card>
    </el-collapse-item>
  </el-collapse>
  <el-splitter style="flex:1;height:0;" v-model="sp" :min="20" :max="80">
    <el-splitter-panel :collapsible="true" collapse-direction="start" size="30%">
      <div style="height:100%;display:flex;flex-direction:column;">
        <div style="margin-bottom:10px;font-weight:bold;">人员列表</div>
        <el-table :data="list" border style="flex:1;min-width:100%;" height="100%" :scrollbar-always-on="true" @row-click="selPerson">
          <el-table-column label="姓名" prop="Name" width="80"></el-table-column>
          <el-table-column label="性别" prop="Gender" width="40"></el-table-column>
          <el-table-column label="年龄" prop="Age" width="50"></el-table-column>
          <el-table-column label="身份证号" prop="IDCard" width="175"></el-table-column>
          <el-table-column label="家庭住址" prop="HomeAddress" width="500"></el-table-column>
        </el-table>
        <div style="text-align:right;padding-top:10px;font-size:8px;">
          <el-pagination v-model:current-page="p" v-model:page-size="ps" :page-sizes="[30,50,100]" :total="total" 
            layout="total, sizes, prev, pager, next, jumper" @size-change="query" @current-change="query"></el-pagination>
        </div>
      </div>
    </el-splitter-panel>
    <el-splitter-panel :collapsible="true" collapse-direction="end">
      <div style="height:100%;display:flex;flex-direction:column;">
        <div style="margin-bottom:10px;font-weight:bold;">家庭成员信息(双击跳转到该人员视角)</div>
        <el-table :data="fList" border style="width:100%;" height="100%" :scrollbar-always-on="true" @row-dblclick="selFamily"
          @row-click="selectFamilySingle" :loading="fLoading">
          <el-table-column label="关系" prop="关系" width="80"></el-table-column>
          <el-table-column label="姓名" prop="姓名" width="90"></el-table-column>
          <el-table-column label="性别" prop="性别" width="50"></el-table-column>
          <el-table-column label="民族" prop="民族" width="90"></el-table-column>
          <el-table-column label="出生时间" prop="出生时间" width="120"></el-table-column>
          <el-table-column label="死亡时间" prop="死亡时间" width="120"></el-table-column>
          <el-table-column label="身份证号" prop="身份证号" width="180"></el-table-column>
          <el-table-column label="工作单位" prop="工作单位" min-width="150"></el-table-column>
          <el-table-column label="联系电话" prop="联系电话" width="130"></el-table-column>
          <el-table-column label="家庭住址" prop="家庭住址" min-width="200"></el-table-column>
          <el-table-column label="父亲身份证号" prop="父亲身份证号" width="180"></el-table-column>
          <el-table-column label="母亲身份证号" prop="母亲身份证号" width="180"></el-table-column>
          <el-table-column label="配偶身份证号" prop="配偶身份证号" width="180"></el-table-column>
        </el-table>
      </div>
    </el-splitter-panel>
  </el-splitter>
  <el-card style="margin-top:10px;">
    <el-button type="primary" @click="saveData">保存</el-button>
    <el-form :model="form" label-width="120px" style="margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;--el-form-item-margin:0;">
      <el-form-item label="姓名"><el-input v-model="form.Name" disabled size="small"></el-input></el-form-item>
      <el-form-item label="身份证"><el-input v-model="form.IDCard" disabled size="small"></el-input></el-form-item>
      <el-form-item label="曾用名"><el-input v-model="form.FormerName" size="small"></el-input></el-form-item>
      <el-form-item label="性别"><el-select v-model="form.Gender" size="small"><el-option label="男" value="男">
          </el-option><el-option label="女" value="女"></el-option></el-select></el-form-item>
      <el-form-item label="民族"><el-input v-model="form.Nation" size="small"></el-input></el-form-item>
      <el-form-item label="生日"><el-date-picker type="date" v-model="form.BirthDate" format="YYYY-MM-DD" value-format="YYYY-MM-DD" size="small">
        </el-date-picker></el-form-item>
      <el-form-item label="死亡"><el-date-picker type="date" v-model="form.DeathDate" format="YYYY-MM-DD" value-format="YYYY-MM-DD" size="small">
        </el-date-picker></el-form-item>
      <el-form-item label="住址"><el-input v-model="form.HomeAddress" size="small"></el-input></el-form-item>
      <el-form-item label="单位"><el-input v-model="form.WorkUnit" size="small"></el-input></el-form-item>
      <el-form-item label="电话"><el-input v-model="form.Telephone" size="small"></el-input></el-form-item>
      <el-form-item label="父亲"><el-input v-model="form.fatherID" size="small"></el-input></el-form-item>
      <el-form-item label="母亲"><el-input v-model="form.motherID" size="small"></el-input></el-form-item>
      <el-form-item label="配偶"><el-input v-model="form.SpouseID" size="small"></el-input></el-form-item>
    </el-form>
  </el-card>
</div>
<script>
const { createApp, ref } = Vue
const ElMessage = ElementPlus.ElMessage
createApp({
  setup() {
    const sp = ref(30), activeName = ref('1'), p = ref(1), ps = ref(30)
    const q = ref({ name:'', idCard:'', address:'' })
    const list = ref([]), total = ref(0), fList = ref([]), fLoading = ref(false)
    const currentMainRSID = ref('')
    
    const form = ref({ RSID:'', Name:'', IDCard:'', FormerName:'', Gender:'', Nation:'', BirthDate:'', DeathDate:'', HomeAddress:'',
      WorkUnit:'', Telephone:'', fatherID:'', motherID:'', SpouseID:'' })
    const selectedRow = ref(null)
    const calcAge = (b, d) => {
      if(!b) return ''
      const base = d ? new Date(d) : new Date()
      const bd = new Date(b)
      let age = base.getFullYear() - bd.getFullYear()
      return base < new Date(base.getFullYear(), bd.getMonth(), bd.getDate()) ? --age : age + ''
    }
    const fillForm = (row, isFamily) => {
      form.value = {
        RSID: row.RSID || '',
        Name: isFamily ? row.姓名 : row.Name || '',
        IDCard: isFamily ? row.身份证号 : row.IDCard || '',
        FormerName: isFamily ? row.曾用名 : row.FormerName || '',
        Gender: isFamily ? row.性别 : row.Gender || '',
        Nation: isFamily ? row.民族 : row.Nation || '',
        BirthDate: isFamily ? row.出生时间 : row.BirthDate || '',
        DeathDate: isFamily ? row.死亡时间 : row.DeathDate || '',
        HomeAddress: isFamily ? row.家庭住址 : row.HomeAddress || '',
        WorkUnit: isFamily ? row.工作单位 : row.WorkUnit || '',
        Telephone: isFamily ? row.联系电话 : row.Telephone || '',
        fatherID: isFamily ? row.父亲身份证号 : row.fatherID || '',
        motherID: isFamily ? row.母亲身份证号 : row.motherID || '',
        SpouseID: isFamily ? row.配偶身份证号 : row.SpouseID || ''
      }
      selectedRow.value = row
    }
    const loadFamilyList = (rsid) => {
      if(!rsid) return
      fLoading.value = true
      axios.get('/api/family-query/', {params:{rsid}}).then(res => {
        fLoading.value = false
        res.data.code === 0 && (fList.value = res.data.data, currentMainRSID.value = rsid)
      }).catch(() => fLoading.value = false)
    }
    const query = () => {
      axios.get('/api/person-query/', {params:{...q.value, page:p.value, pageSize:ps.value}}).then(res=>{
        res.data.code === 0 && (list.value = res.data.data.map(i=>({...i, Age:calcAge(i.BirthDate,i.DeathDate)})), total.value = res.data.total, fList.value = [])
      })
    }
    const reset = () => { q.value = {name:'',idCard:'',address:''}, query() }
    const selPerson = (row) => { fillForm(row), loadFamilyList(row.RSID) }
    const selectFamilySingle = (row) => { row.RSID ? fillForm(row, 1) : ElMessage.warning('该行无RSID') }
    const selFamily = (row) => { row.RSID && (loadFamilyList(row.RSID), fillForm(row, 1)) }
    const saveData = () => {
      if(!selectedRow.value?.RSID) return ElMessage.warning("请选择人员")
      axios.post('/api/person-save/', { RSID: selectedRow.value.RSID, ...form.value }).then(res=>{
        if(res.data.code === 0){
          ElMessage.success(res.data.msg)
          selectedRow.value && Object.assign(selectedRow.value, {...form.value, Age:calcAge(form.value.BirthDate, form.value.DeathDate)})
        }else{
          ElMessage.error(res.data.msg)
        }
      }).catch(()=>ElMessage.error("请求失败"))
    }
    return { sp, activeName, p, ps, q, list, total, fList, fLoading, form, selectedRow, calcAge, query, reset, selPerson, selectFamilySingle, selFamily, saveData }
  }
}).use(ElementPlus, { locale: ElementPlusLocaleZhCn }).mount('#app')
</script>
{% endblock %}
