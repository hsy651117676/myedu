<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}系统页面{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus/dist/index.full.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus/dist/locale/zh-cn.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/axios/1.6.0/axios.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f7fa; min-height: 100vh; }
    .el-collapse-item__header {
  height: 24px !important;
  min-height: 24px !important;
  padding-top: 0 !important;
  padding-bottom: 0 !important;
  line-height: 24px !important;
}
.el-collapse-item__arrow {
  line-height: 24px !important;
}
  .el-tabs__header {
  height: 32px !important;
  margin: 0 !important;
}

.el-tabs__nav-wrap {
  height: 32px !important;
}

.el-tabs__nav {
  height: 32px !important;
}

.el-tabs__item {
  height: 32px !important;
  line-height: 32px !important;
  padding: 0 16px !important;
}

.el-tabs__active-bar {
  height: 2px !important;
}
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
