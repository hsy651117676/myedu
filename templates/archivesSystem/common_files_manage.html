{% extends "layout/base.html" %}
{% block title %}文件管理{% endblock %}
{% block content %}
<style>
html, body { height:100%; margin:0; padding:0; overflow:hidden; }
.file-table { border-collapse:collapse; width:100%; font-size:12px; }
.file-table th, .file-table td { border:1px solid #ddd; padding:4px 8px; text-align:center; white-space:nowrap; }
.file-table th { background:#f5f7fa; position:sticky; top:0; z-index:1; }
.file-table tr { cursor:pointer; }
.file-table tr:hover { background:#e8f0fe; }
.file-table tr.active { background:#d0e4fc; }
.tree-node { padding:4px 10px; cursor:pointer; font-size:13px; }
.tree-node:hover { background:#e8f0fe; }
.tree-node.active { background:#d0e4fc; }
.drag-bar { width:4px; background:#e4e7ed; cursor:col-resize; flex-shrink:0; }
</style>

<div id="app" style="height:100%;display:flex;flex-direction:column;overflow:hidden;">

    <div style="padding:8px 12px;border-bottom:1px solid #e4e7ed;background:#fff;display:flex;align-items:center;gap:8px;flex-shrink:0;">
        <span style="font-weight:600;">📁 文件管理</span>
        <input v-model="q.year" placeholder="年度" style="width:80px;height:28px;border:1px solid #dcdfe6;border-radius:4px;padding:0 8px;font-size:12px;">
        <el-button size="small" @click="loadList(1)">显示文号</el-button>
        <div style="flex:1;"></div>
        <el-button size="small" type="primary" @click="addVisible=true">新增</el-button>
        <el-button size="small" type="success" @click="editSelected" :disabled="!selectedFileNo">编辑人员</el-button>
        <el-button size="small" type="warning" @click="renameSelected" :disabled="!selectedFileNo">修改信息</el-button>
        <el-button size="small" type="danger" @click="deleteSelected" :disabled="!selectedFileNo">删除</el-button>
        <el-button size="small" type="info" @click="updatePdfVisible = true" :disabled="!selectedFileNo">更新PDF</el-button>
        <el-button size="small" @click="showAddCategory = true">新增类别</el-button>
    </div>

    <div style="flex:1;display:flex;overflow:hidden;">

        <div id="leftPanel" class="resize-panel" style="width:200px;min-width:150px;border-right:1px solid #e4e7ed;display:flex;flex-direction:column;overflow:hidden;">
            <div style="padding:6px 8px;border-bottom:1px solid #e4e7ed;font-weight:bold;font-size:13px;flex-shrink:0;">类别</div>
            <div style="flex:1;overflow-y:auto;">
                <div v-for="c in categories" :key="c" class="tree-node"
                     :class="{active: selectedCategory===c}" @click="selectCategory(c)">📁 [[ c ]]</div>
            </div>
        </div>

        <div class="drag-bar" data-target="left" style="width:4px;background:#e4e7ed;cursor:col-resize;flex-shrink:0;"></div>

        <div id="midPanel" class="resize-panel" style="width:40%;min-width:250px;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #e4e7ed;">
            <div style="flex:1;overflow:auto;">
                <table class="file-table">
                  <thead><tr><th style="width:40px;">选</th><th>文号</th><th>文件名称</th><th>人数</th><th>年度</th></tr></thead>
                    <tbody>
                        <tr v-for="r in list" :key="r.FileNo" :class="{active: selectedFileNo===r.FileNo}" @click="selectedFileNo=r.FileNo">
                            <td><input type="radio" :value="r.FileNo" v-model="selectedFileNo" @click.stop /></td>
                            <td>[[ r.FileNo ]]</td><td>[[ r.FileName ]]</td><td>[[ r.PersonCount ]]</td><td>[[ r.Year ]]</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div v-if="total>0" style="padding:6px 0;display:flex;justify-content:center;flex-shrink:0;">
                <el-pagination small background layout="total, sizes, prev, pager, next"
                    :page-sizes="[20,30,50,100]" :page-size="pageSize" :total="total"
                    :current-page="currentPage" @size-change="onSizeChange" @current-change="onPageChange" />
            </div>
        </div>

        <div class="drag-bar" data-target="mid" style="width:4px;background:#e4e7ed;cursor:col-resize;flex-shrink:0;"></div>

        <div id="rightPanel" class="resize-panel" style="flex:1;min-width:300px;display:flex;flex-direction:column;overflow:hidden;">
            <div v-if="pdfUrl" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
                <div style="padding:6px 8px;border-bottom:1px solid #e4e7ed;font-weight:bold;flex-shrink:0;">PDF预览</div>
                <iframe :src="pdfUrl" style="flex:1;border:none;"></iframe>
            </div>
            <div v-else style="flex:1;display:flex;align-items:center;justify-content:center;color:#ccc;">选中文件后预览</div>
        </div>
    </div>

    <!-- 新增弹窗 -->
    <el-dialog v-model="addVisible" title="新增文件" width="900px" draggable @closed="addVisible=false">
        <iframe src="/archivesSystem/files/dialog/add/" style="width:100%;height:550px;border:none;"></iframe>
    </el-dialog>

    <!-- 编辑弹窗 -->
    <el-dialog v-model="editVisible" title="编辑人员" width="900px" draggable @closed="editIframeSrc=''">
        <iframe :src="'/archivesSystem/files/dialog/edit/?fileNo='+selectedFileNo" style="width:100%;height:550px;border:none;"></iframe>
    </el-dialog>

    <!-- 修改信息弹窗 -->
    <el-dialog v-model="renameVisible" title="修改文件信息" width="500px" draggable @closed="renameVisible=false">
    <el-form label-width="80px">
        <el-form-item label="文号"><el-input v-model="renameForm.fileNo" /></el-form-item>
        <el-form-item label="类别"><el-input v-model="renameForm.category" /></el-form-item>
        <el-form-item label="年度"><el-input v-model="renameForm.year" /></el-form-item>
        <el-form-item label="文件名"><el-input v-model="renameForm.fileName" /></el-form-item>
    </el-form>
    <template #footer>
        <el-button @click="renameVisible=false">取消</el-button>
        <el-button type="primary" @click="doRename">保存</el-button>
    </template>
</el-dialog>
<!-- 更新PDF弹窗 -->
<el-dialog v-model="updatePdfVisible" title="更新PDF文件" width="450px" draggable @closed="uploadFile=null; if($refs.uploadRef) $refs.uploadRef.clearFiles()">
    <div style="margin-bottom:12px;color:#606266;">
        当前文件：<b>[[ selectedFileNo ]]</b>
    </div>
    <el-upload
        ref="uploadRef"
        :auto-upload="false"
        :limit="1"
        accept=".pdf"
        drag
        action="#"
        :on-change="(file) => uploadFile = file.raw"
        :on-remove="() => uploadFile = null"
    >
        <el-icon><upload-filled /></el-icon>
        <div class="el-upload__text">拖拽PDF文件到此处或<em>点击上传</em></div>
        <template #tip>
            <div class="el-upload__tip">仅支持PDF文件，上传后将替换原文件</div>
        </template>
    </el-upload>
    <template #footer>
        <el-button @click="updatePdfVisible = false">取消</el-button>
        <el-button type="primary" @click="doUpdatePdf" :loading="uploading" :disabled="!uploadFile">确认替换</el-button>
    </template>
</el-dialog>
<!-- 新增类别弹窗 -->
<el-dialog v-model="showAddCategory" title="新增类别" width="350px">
    <el-input v-model="newCategoryName" placeholder="输入类别名称" @keyup.enter="doAddCategory" />
    <template #footer>
        <el-button @click="showAddCategory = false">取消</el-button>
        <el-button type="primary" @click="doAddCategory">确定</el-button>
    </template>
</el-dialog>
</div>

<script>
  const { createApp, ref, reactive, watch, onMounted } = Vue;
const { ElMessage, ElMessageBox } = ElementPlus;

createApp({
    delimiters: ['[[', ']]'],
    setup(){
        const categories = ref([]);
        const selectedCategory = ref('');
        const q = reactive({year:''});
        const list = ref([]);
        const total = ref(0);
        const currentPage = ref(1);
        const pageSize = ref(20);
        const selectedFileNo = ref('');
        const pdfUrl = ref('');

        const addVisible = ref(false);
        const editVisible = ref(false);
        const renameVisible = ref(false);
        const renameForm = reactive({fileNo:'', category:'', year:'', fileName:''});

        const loadCategories = async () => {
            const r = await axios.get('/archivesSystem/api/files/categories/');
            if (r.data.code===0) categories.value = r.data.data||[];
        };
        const selectCategory = (c) => { selectedCategory.value=c; selectedFileNo.value=''; loadList(1); };
        const loadList = async (page) => {
            if (!selectedCategory.value) return;
            const r = await axios.get('/archivesSystem/api/files/manage/list/', {
                params: {category:selectedCategory.value, year:q.year, page:page||1, pageSize:pageSize.value}
            });
            if (r.data.code===0) { list.value=r.data.data||[]; total.value=r.data.total||0; currentPage.value=page||1; }
        };

        watch(selectedFileNo, async (val) => {
            if (!val) { pdfUrl.value=''; return; }
            const r = await axios.get('/archivesSystem/api/files/manage/persons/', {params:{fileNo:val}});
            if (r.data.code===0 && r.data.data.length) {
                pdfUrl.value = '/archivesSystem/api/files/download/?id=' + r.data.data[0].FileID;
            }
        });

        window.addEventListener('message', (e) => {
            if (e.data.type === 'close-dialog') { addVisible.value = false; editVisible.value = false; }
            if (e.data.type === 'file-added' || e.data.type === 'file-edited') { loadList(currentPage.value); }
        });

        const editSelected = () => {
            if (!selectedFileNo.value) return;
            editVisible.value = true;
        };

        const renameSelected = async () => {
            if (!selectedFileNo.value) return;
            const r = await axios.get('/archivesSystem/api/files/manage/persons/', {params:{fileNo:selectedFileNo.value}});
            if (r.data.code===0 && r.data.data.length) {
                renameForm.fileNo = r.data.data[0].FileNo;
                renameForm.category = r.data.data[0].Category;
                renameForm.year = r.data.data[0].Year;
                renameForm.fileName = r.data.data[0].FileName;
                renameVisible.value = true;
            }
        };
        const doRename = async () => {
            await axios.post('/archivesSystem/api/files/manage/rename/', {
                oldFileNo: selectedFileNo.value,
                FileNo: renameForm.fileNo, Category: renameForm.category,
                Year: renameForm.year, FileName: renameForm.fileName
            });
            ElMessage.success('修改成功'); renameVisible.value = false;
            selectedFileNo.value = renameForm.fileNo; loadList(currentPage.value);
        };

        const deleteSelected = async () => {
            if (!selectedFileNo.value) return;
            await ElMessageBox.confirm('确定删除？','确认',{type:'warning'});
            await axios.post('/archivesSystem/api/files/manage/save/', {action:'delete', FileNo:selectedFileNo.value});
            ElMessage.success('已删除'); selectedFileNo.value=''; loadList(currentPage.value);
        };

        const onPageChange = (p) => loadList(p);
        const onSizeChange = (s) => { pageSize.value=s; loadList(1); };

        onMounted(loadCategories);

        const initDrag = () => {
            document.querySelectorAll('.drag-bar').forEach(bar => {
                bar.addEventListener('mousedown', (e) => {
                    const panel = document.getElementById(bar.dataset.target+'Panel');
                    if (!panel) return;
                    const startX = e.clientX, startW = panel.offsetWidth;
                    document.querySelectorAll('.resize-panel').forEach(p => {
                        const iframe = p.querySelector('iframe');
                        if (iframe) iframe.style.pointerEvents = 'none';
                    });
                    const onMove = (ev) => {
                        let w = startW + ev.clientX - startX;
                        if (w < 120) w = 120; if (w > 900) w = 900;
                        panel.style.width = w + 'px'; panel.style.minWidth = w + 'px';
                        panel.style.flexShrink = '0'; panel.style.flexGrow = '0';
                    };
                    const onUp = () => {
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                        document.body.style.cursor = ''; document.body.style.userSelect = '';
                        document.querySelectorAll('.resize-panel').forEach(p => {
                            const iframe = p.querySelector('iframe');
                            if (iframe) iframe.style.pointerEvents = '';
                        });
                    };
                    document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                    e.preventDefault();
                });
            });
        };
        onMounted(initDrag);
        const updatePdfVisible = ref(false);
        const uploadFile = ref(null);
        const uploading = ref(false);

        const doUpdatePdf = async () => {
            if (!uploadFile.value) {
                ElMessage.warning('请选择PDF文件');
                return;
            }
            uploading.value = true;
            try {
                const formData = new FormData();
                formData.append('file', uploadFile.value);
                formData.append('file_no', selectedFileNo.value);
                
                const r = await axios.post('/archivesSystem/api/files/manage/update-pdf/', formData);
                if (r.data.code === 0) {
                    ElMessage.success('PDF更新成功');
                    updatePdfVisible.value = false;
                    uploadFile.value = null;
                    // 刷新预览，添加时间戳避免缓存
                    if (pdfUrl.value) {
                        pdfUrl.value = pdfUrl.value.split('&t=')[0] + '&t=' + Date.now();
                    }
                } else {
                    ElMessage.error(r.data.msg || '更新失败');
                }
            } catch (e) {
                ElMessage.error('更新失败');
            } finally {
                uploading.value = false;
            }
        };
      const showAddCategory = ref(false);
      const newCategoryName = ref('');

      const doAddCategory = async () => {
          if (!newCategoryName.value.trim()) {
              ElMessage.warning('请输入类别名称');
              return;
          }
          const r = await axios.post('/archivesSystem/api/files/categories/add/', {
              category: newCategoryName.value.trim()
          });
          if (r.data.code === 0) {
              ElMessage.success('新增成功');
              categories.value.push(newCategoryName.value.trim());
              categories.value.sort();
              showAddCategory.value = false;
              newCategoryName.value = '';
          } else {
              ElMessage.error(r.data.msg || '新增失败');
          }
      };

        return { categories, selectedCategory, q, list, total, currentPage, pageSize,
                 selectedFileNo, pdfUrl, addVisible, editVisible, renameVisible, renameForm,
                 selectCategory, loadList, editSelected, renameSelected, doRename, deleteSelected,
                 onPageChange, onSizeChange, updatePdfVisible, uploadFile, uploading, doUpdatePdf, 
                 showAddCategory, newCategoryName, doAddCategory,};
    }
}).use(ElementPlus, { locale: ElementPlusLocaleZhCn }).mount('#app');
</script>
{% endblock %}
