{% extends "layout/base.html" %}
{% block title %}材料名称维护{% endblock %}
{% block content %}
<style>
html, body { height:100%; margin:0; padding:0; overflow:hidden; }
#app { height:100%; display:flex; flex-direction:column; padding:10px; }
.auto-table { border-collapse:collapse; width:100%; font-size:13px; }
.auto-table th, .auto-table td { padding:6px 8px; border:1px solid #ddd; }
.auto-table th { background:#f5f5f5; }
.auto-table td input { width:100%; border:1px solid #ddd; padding:4px; }
</style>

<div id="app">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
    <span style="font-weight:bold;">分类：</span>
    <el-select v-model="q.fl" size="small" clearable style="width:200px;" @change="doQuery">
      <el-option v-for="f in flList" :key="f" :label="f" :value="f"></el-option>
    </el-select>
    <span style="font-weight:bold;">搜索：</span>
    <el-input v-model="q.keyword" size="small" placeholder="材料名称" style="width:250px;" @keyup.enter="doQuery"></el-input>
    <el-button type="primary" size="small" @click="doQuery">查询</el-button>
    <el-button size="small" @click="addRow">新增材料名称</el-button>
    <el-button size="small" type="success" @click="exportJs">生成JS文件(注意，此按钮是生成到服务器，一般材料名称有很大改变才点，平时不用点)</el-button>
  </div>

  <div style="flex:1;overflow:auto;">
    <table class="auto-table">
      <thead>
        <tr>
          <th style="width:60px;">ID</th>
          <th>材料名称</th>
          <th style="width:200px;">分类</th>
          <th style="width:150px;">更新时间</th>
          <th style="width:100px;">操作</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="(r,i) in list" :key="r.id">
          <td style="text-align:center;">[[ r.id ]]</td>
          <td>
            <span v-if="r._editing">
              <input v-model="r.archivesName" style="width:100%;">
            </span>
            <span v-else>[[ r.archivesName ]]</span>
          </td>
          <td>
            <span v-if="r._editing">
              <el-select v-model="r.flName" size="small" style="width:100%;" filterable allow-create>
                <el-option v-for="f in flList" :key="f" :label="f" :value="f"></el-option>
              </el-select>
            </span>
            <span v-else>[[ r.flName ]]</span>
          </td>
          <td>[[ r.updateTime ]]</td>
          <td style="text-align:center;">
            <template v-if="r._editing">
              <el-button size="small" type="success" @click="saveRow(r)">保存</el-button>
              <el-button size="small" @click="r._editing=false; loadData()">取消</el-button>
            </template>
            <template v-else>
              <el-button size="small" @click="r._editing=true">编辑</el-button>
              <el-button size="small" type="danger" @click="delRow(r)">删除</el-button>
            </template>
          </td>
        </tr>
      </tbody>
    </table>
    <div v-if="list.length===0" style="text-align:center;color:#909399;padding:40px;">暂无数据</div>
  </div>

  <div style="display:flex;justify-content:flex-end;padding-top:10px;">
    <el-pagination v-model:current-page="page" v-model:page-size="pageSize" :total="total"
      :page-sizes="[30,50,100]" layout="total, sizes, prev, pager, next" @size-change="doQuery" @current-change="doQuery" small>
    </el-pagination>
  </div>
</div>

<script>
(function(){
  const { createApp, ref, reactive, onMounted } = Vue;
  const { ElMessage, ElMessageBox } = ElementPlus;
  const app = createApp({
    setup() {
      const q = reactive({ keyword: '', fl: '' });
      const list = ref([]);
      const flList = ref([]);
      const page = ref(1);
      const pageSize = ref(30);
      const total = ref(0);

      const loadFl = () => {
        axios.get('/system/api/archives-auto-fl/').then(res => {
          if (res.data.code === 0) flList.value = res.data.data;
        });
      };

      const doQuery = () => {
        axios.get('/system/api/archives-auto-list/', {
          params: { keyword: q.keyword, fl: q.fl, page: page.value, pageSize: pageSize.value }
        }).then(res => {
          if (res.data.code === 0) {
            list.value = res.data.data.map(r => ({ ...r, _editing: false }));
            total.value = res.data.total;
          }
        });
      };

      const addRow = () => {
        list.value.unshift({
          id: null, archivesName: '', flName: q.fl || '', updateTime: '', _editing: true, _isNew: true
        });
      };

      const saveRow = (r) => {
        let action = r._isNew ? 'add' : 'update';
        axios.post('/system/api/archives-auto-save/', {
          action, id: r.id, archivesName: r.archivesName, flName: r.flName
        }).then(res => {
          if (res.data.code === 0) {
            ElMessage.success('保存成功');
            doQuery();
          } else {
            ElMessage.error(res.data.msg);
          }
        });
      };

      const delRow = (r) => {
        ElMessageBox.confirm('确定删除该条材料名称？', '确认', { type: 'warning' }).then(() => {
          axios.post('/system/api/archives-auto-save/', { action: 'delete', id: r.id }).then(res => {
            if (res.data.code === 0) { ElMessage.success('已删除'); doQuery(); }
          });
        });
      };
const exportJs = () => {
  axios.get('/system/api/archives-auto-export/').then(res => {
    ElMessage[res.data.code===0?'success':'error'](res.data.msg);
  });
};
      onMounted(() => { loadFl(); doQuery(); });

      return { q, list, flList, page, pageSize, total, doQuery, addRow, saveRow, delRow,exportJs };
    }
  });
  app.config.compilerOptions.delimiters = ['[[', ']]'];
  app.use(ElementPlus).mount('#app');
})();
</script>
{% endblock %}
