{% extends "layout/base.html" %}
{% block title %}档案用户管理{% endblock %}
{% block content %}
<style>
html, body { height:100%; margin:0; padding:0; overflow:hidden; }
.user-table { border-collapse:collapse; width:100%; font-size:12px; }
.user-table th, .user-table td { border:1px solid #ddd; padding:4px 6px; text-align:center; white-space:nowrap; }
.user-table th { background:#f5f7fa; position:sticky; top:0; z-index:2; }
.user-table td input, .user-table td select { border:1px solid transparent; padding:2px 4px; font-size:12px; text-align:center; background:transparent; width:100%; box-sizing:border-box; }
.user-table td input:focus, .user-table td select:focus { background:#fff; border-color:#409eff; outline:none; }
.user-table td input[type=checkbox] { width:auto; }
.table-wrap { flex:1; overflow-y:auto; overflow-x:auto; }
</style>

<div id="app" style="height:100%;display:flex;flex-direction:column;overflow:hidden;">

    <!-- 上 -->
    <div style="padding:8px 12px;border-bottom:1px solid #e4e7ed;background:#fff;
                display:flex;align-items:center;gap:8px;flex-shrink:0;">
        <span style="font-weight:600;">📋 档案用户管理</span>
        <div style="flex:1;"></div>
        <el-button size="small" @click="showUnassigned">未分配单位</el-button>
        <el-button size="small" type="primary" @click="showAddDialog">添加</el-button>
        <el-button size="small" type="danger" @click="deleteUsers" :disabled="selectedIds.length===0">删除</el-button>
        <el-button size="small" type="warning" @click="resetPwd" :disabled="selectedIds.length===0">重置密码</el-button>
        <el-button size="small" type="success" @click="saveUsers" :disabled="selectedIds.length===0">保存</el-button>
    </div>

    <!-- 中 -->
    <div style="flex:1;display:flex;overflow:hidden;">
        <div style="width:240px;border-right:1px solid #e4e7ed;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;">
            <div style="padding:6px 8px;border-bottom:1px solid #e4e7ed;font-weight:bold;font-size:13px;flex-shrink:0;">🏢 单位列表</div>
            <div style="flex:1;overflow-y:auto;padding:4px;">
                <template v-for="g in groupList" :key="'g-'+g.TID">
                    <div @click="toggleGroup(g)" :style="{padding:'6px 10px',cursor:'pointer',fontWeight:'bold',fontSize:'13px',background: selectedUnitId===g.TID ? '#e6f7ff' : ''}">
                        <span style="font-size:11px;">[[ g.expanded ? '▼' : '▶' ]]</span> 🏢 [[ g.TNAME ]]
                    </div>
                    <template v-if="g.expanded && g.children">
                        <div v-for="c in g.children" :key="'c-'+c.TID" @click="selectUnit(c)"
                             :style="{padding:'5px 10px 5px 24px',cursor:'pointer',fontSize:'12px',background: selectedUnitId===c.TID ? '#bae7ff' : ''}">
                            🏫 [[ c.TNAME ]]
                        </div>
                    </template>
                </template>
            </div>
        </div>

        <!-- 右：表格区域 -->
        <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
            <div v-if="showUnassignedMode" style="padding:4px 12px;color:#e6a23c;font-weight:bold;flex-shrink:0;">⚠ 未分配单位用户</div>
            <div class="table-wrap">
                <table class="user-table">
                    <thead>
                        <tr>
                            <th style="width:40px;"><input type="checkbox" @change="toggleAll" :checked="allSelected" /></th>
                            <th style="width:60px;">编号</th>
                            <th style="width:100px;">登录名</th>
                            <th style="width:80px;">姓名</th>
                            <th style="width:100px;">职务</th>
                            <th style="width:150px;">单位</th>
                            <th style="width:60px;">类型</th>
                            <th style="width:60px;">组编号</th>
                            <th style="width:100px;">机构权限</th>
                            <th style="width:120px;">电话</th>
                            <th style="width:100px;">档案业务</th>
                            <th style="width:60px;">扫描</th>
                            <th style="width:60px;">审核</th>
                            <th style="width:70px;">打印查看</th>
                            <th style="width:70px;">日常业务</th>
                            <th style="width:70px;">系统管理</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="r in userList" :key="r.YHBH" :style="{background: r._checked ? '#e6f7ff' : '#fff'}">
                            <td><input type="checkbox" v-model="r._checked" @change="onRowCheck" /></td>
                            <td>[[ r.YHBH ]]</td>
                            <td>[[ r.USERID ]]</td>
                            <td><input v-model="r.YHMC" /></td>
                            <td><input v-model="r.ZW" /></td>
                            <td>
                                <select v-model="r.DEPARTID">
                                    <option value="">未分配</option>
                                    <option v-for="d in departList" :key="d.BM" :value="d.BM">[[ d.BMMC ]]</option>
                                </select>
                            </td>
                            <td><input v-model="r.LX" /></td>
                            <td><input v-model="r.ZBH" /></td>
                            <td><input v-model="r.JGQX" /></td>
                            <td><input v-model="r.DOORSTR" /></td>
                            <td><input v-model="r.HANDSTR" /></td>
                            <td><select v-model="r.SCAN"><option :value="0">否</option><option :value="1">是</option></select></td>
                            <td><select v-model="r.CHECKARCH"><option :value="0">否</option><option :value="1">是</option></select></td>
                            <td><select v-model="r.PRINTVIEW"><option :value="0">否</option><option :value="1">是</option></select></td>
                            <td><select v-model="r.RCYW"><option :value="0">否</option><option :value="1">是</option></select></td>
                            <td><select v-model="r.SYSTEMMANA"><option :value="0">否</option><option :value="1">是</option></select></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- 分页 -->
            <div v-if="total>0" style="padding:6px 12px;border-top:1px solid #e4e7ed;display:flex;justify-content:center;flex-shrink:0;">
                <el-pagination small background layout="total, prev, pager, next" :total="total"
                    :page-size="pageSize" :current-page="currentPage" @current-change="goPage" />
            </div>
        </div>
    </div>

    <!-- 添加弹窗 -->
    <el-dialog v-model="addDialogVisible" title="添加档案用户" width="450px">
        <el-form label-width="80px">
            <el-form-item label="登录名"><el-input v-model="addForm.USERID" /></el-form-item>
            <el-form-item label="姓名"><el-input v-model="addForm.YHMC" /></el-form-item>
            <el-form-item label="职务"><el-input v-model="addForm.ZW" /></el-form-item>
            <el-form-item label="单位"><el-select v-model="addForm.DEPARTID" clearable><el-option v-for="d in departList" :key="d.BM" :label="d.BMMC" :value="d.BM" /></el-select></el-form-item>
            <el-form-item label="类型"><el-input v-model="addForm.LX" /></el-form-item>
            <el-form-item label="组编号"><el-input v-model="addForm.ZBH" /></el-form-item>
            <el-form-item label="机构权限"><el-input v-model="addForm.JGQX" /></el-form-item>
            <el-form-item label="电话"><el-input v-model="addForm.DOORSTR" /></el-form-item>
            <el-form-item label="档案业务"><el-input v-model="addForm.HANDSTR" /></el-form-item>
            <el-form-item label="扫描"><el-switch v-model="addForm.SCAN" :active-value="1" :inactive-value="0" /></el-form-item>
            <el-form-item label="审核"><el-switch v-model="addForm.CHECKARCH" :active-value="1" :inactive-value="0" /></el-form-item>
            <el-form-item label="打印查看"><el-switch v-model="addForm.PRINTVIEW" :active-value="1" :inactive-value="0" /></el-form-item>
            <el-form-item label="日常业务"><el-switch v-model="addForm.RCYW" :active-value="1" :inactive-value="0" /></el-form-item>
            <el-form-item label="系统管理"><el-switch v-model="addForm.SYSTEMMANA" :active-value="1" :inactive-value="0" /></el-form-item>
        </el-form>
        <template #footer>
            <el-button @click="addDialogVisible=false">取消</el-button>
            <el-button type="primary" @click="doAdd">确定</el-button>
        </template>
    </el-dialog>
</div>

<script>
  const { createApp, ref, reactive, computed } = Vue;
const { ElMessage, ElMessageBox } = ElementPlus;

const app = createApp({
    delimiters: ['[[', ']]'],
    setup(){
        const groupList = ref([]);
        const userList = ref([]);
        const selectedUnitId = ref('');
        const showUnassignedMode = ref(false);
        const departList = ref([]);
        const addDialogVisible = ref(false);
        const addForm = reactive({USERID:'',YHMC:'',ZW:'',DEPARTID:'',LX:'',ZBH:'',JGQX:'',DOORSTR:'',HANDSTR:'',SCAN:0,CHECKARCH:0,PRINTVIEW:0,RCYW:0,SYSTEMMANA:0});
        const total = ref(0);
        const currentPage = ref(1);
        const pageSize = ref(30);

        const selectedIds = computed(() => userList.value.filter(u=>u._checked).map(u=>u.YHBH));
        const allSelected = computed(() => userList.value.length>0 && userList.value.every(u=>u._checked));

        const loadDeparts = async () => {
            const r = await axios.get('/api/depart-list/');
            if(r.data.code===0) departList.value=r.data.data;
        };
        const loadTree = async () => {
            const r = await axios.get('/components/tree/');
            if(r.data.code===0) groupList.value=(r.data.data||[]).map(n=>({...n,expanded:false,children:[]}));
        };
        const toggleGroup = async (node) => {
            if(node.expanded){node.expanded=false;return;}
            if(node.children.length>0){node.expanded=true;return;}
            const r = await axios.get('/components/tree-children/',{params:{tid:node.TID}});
            if(r.data.code===0){node.children=r.data.data;node.expanded=true;}
        };

        const fetchUsers = async (departId, unassigned, page) => {
            const params = { page: page||1, pageSize: pageSize.value };
            if(unassigned) params.unassigned = '1';
            else if(departId) params.departId = departId;
            else return;
            const r = await axios.get('/api/archive-users/query/',{params});
            if(r.data.code===0){
                userList.value = (r.data.data||[]).map(u=>({...u,_checked:false}));
                total.value = r.data.total||0;
                currentPage.value = page||1;
            }
        };

        const selectUnit = (node) => {
            selectedUnitId.value=node.TID;showUnassignedMode.value=false;
            fetchUsers(node.TID, false, 1);
        };
        const showUnassigned = () => {
            showUnassignedMode.value=!showUnassignedMode.value;
            if(showUnassignedMode.value){selectedUnitId.value='';fetchUsers('',true,1);}
            else{userList.value=[];total.value=0;}
        };
        const goPage = (page) => {
            if(showUnassignedMode.value) fetchUsers('', true, page);
            else if(selectedUnitId.value) fetchUsers(selectedUnitId.value, false, page);
        };

        const toggleAll = (e) => {
            userList.value.forEach(u=>u._checked=e.target.checked);
        };
        const onRowCheck = () => {};

        const saveUsers = async () => {
            const rows = userList.value.filter(u=>u._checked);
            if(!rows.length){ElMessage.warning('请勾选行');return;}
            const data = rows.map(r=>({
                YHBH:r.YHBH,YHMC:r.YHMC,ZW:r.ZW,DEPARTID:r.DEPARTID,LX:r.LX,ZBH:r.ZBH,
                JGQX:r.JGQX,DOORSTR:r.DOORSTR,HANDSTR:r.HANDSTR,
                SCAN:r.SCAN,CHECKARCH:r.CHECKARCH,PRINTVIEW:r.PRINTVIEW,RCYW:r.RCYW,SYSTEMMANA:r.SYSTEMMANA
            }));
            await axios.post('/api/archive-users/save/',{action:'update',rows:data});
            ElMessage.success('保存成功');
            goPage(currentPage.value);
        };
        const deleteUsers = async () => {
            if(!selectedIds.value.length){ElMessage.warning('请勾选行');return;}
            await ElMessageBox.confirm('确定删除？','确认',{type:'warning'});
            await axios.post('/api/archive-users/save/',{action:'delete',ids:selectedIds.value});
            ElMessage.success('已删除');
            goPage(currentPage.value);
        };
        const resetPwd = async () => {
            if(!selectedIds.value.length){ElMessage.warning('请勾选行');return;}
            await ElMessageBox.confirm('确定重置密码为 12345abcde？','确认',{type:'warning'});
            await axios.post('/api/archive-users/save/',{action:'reset_pwd',ids:selectedIds.value});
            ElMessage.success('密码已重置');
        };
        const showAddDialog = () => {
            Object.assign(addForm,{USERID:'',YHMC:'',ZW:'',DEPARTID:'',LX:'',ZBH:'',JGQX:'',DOORSTR:'',HANDSTR:'',SCAN:0,CHECKARCH:0,PRINTVIEW:0,RCYW:0,SYSTEMMANA:0});
            addDialogVisible.value=true;
        };
        const doAdd = async () => {
            if(!addForm.USERID){ElMessage.warning('请输入登录名');return;}
            await axios.post('/api/archive-users/save/',{action:'add',...addForm});
            ElMessage.success('添加成功，初始密码: 12345abcde');
            addDialogVisible.value=false;
            if(showUnassignedMode.value) showUnassigned();else if(selectedUnitId.value) selectUnit({TID:selectedUnitId.value});
        };

        loadDeparts();loadTree();
        return {groupList,userList,selectedUnitId,showUnassignedMode,selectedIds,allSelected,departList,addDialogVisible,addForm,total,currentPage,pageSize,
                toggleGroup,selectUnit,showUnassigned,goPage,toggleAll,onRowCheck,saveUsers,deleteUsers,resetPwd,showAddDialog,doAdd};
    }
});

app.use(ElementPlus, { locale: ElementPlusLocaleZhCn }).mount('#app');sdfgh
</script>
{% endblock %}
