{% extends "layout/base.html" %}
{% block title %}同材料批量建档{% endblock %}
{% block content %}
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { height:100vh; display:flex; flex-direction:column; overflow:hidden; background:#f5f7fa; font-size:13px; }
#app { display:flex; flex-direction:column; height:100%; }
.toolbar { background:#fff; padding:10px 16px; border-bottom:1px solid #ebeef5; display:flex; gap:8px; align-items:center; flex-wrap:wrap; flex-shrink:0; }
.toolbar .el-select { width:130px; }
.toolbar .el-input { width:90px; }
.toolbar .el-input.wide { width:200px; }
.toolbar .label { font-size:12px; color:#606266; white-space:nowrap; }
.main-area { display:flex; overflow:hidden; flex:1; min-height:0; }
.panel { display:flex; flex-direction:column; overflow:auto; background:#fff; flex-shrink:0; }
.panel-header { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-bottom:1px solid #eee; flex-shrink:0; }
.panel-header h3 { font-size:14px; color:#303133; margin:0; }
.panel-body { flex:1; overflow:auto; padding:8px 12px; }
.left-panel { width:25%; min-width:220px; border-right:1px solid #eee; }
.mid-panel { width:45%; min-width:400px; border-right:1px solid #eee; }
.right-panel { width:30%; min-width:250px; }
.divider { width:4px; cursor:col-resize; background:#e0e0e0; flex-shrink:0; }
.divider:hover, .divider.active { background:#409EFF; }
.right-section { padding:16px; }
.right-section h4 { font-size:14px; color:#303133; margin:0 0 10px 0; padding-bottom:8px; border-bottom:1px solid #eee; }
.help-text { font-size:13px; color:#666; line-height:2; }
.help-text .highlight { color:#409EFF; font-weight:600; }
.help-text .warn { color:#e6a23c; }
.help-text .success { color:#67c23a; }
.stat-cards { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
.stat-card { text-align:center; padding:14px 10px; border-radius:6px; color:#fff; font-size:13px; cursor:pointer; }
.stat-card:hover { opacity:0.85; }
.stat-card .num { font-size:32px; font-weight:700; display:block; }
.stat-card.green { background:#67c23a; }
.stat-card.yellow { background:#e6a23c; }
.stat-card.red { background:#f56c6c; }
.unmatched-list { margin-top:12px; }
.unmatched-list .title { font-size:13px; color:#f56c6c; font-weight:600; margin-bottom:6px; }
.unmatched-list .el-tag { cursor:pointer; margin:2px; }
.loading-spinner { width:48px; height:48px; border:4px solid #e0e0e0; border-top-color:#409EFF; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto; }
@keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
.pdf-dialog .el-dialog__body { padding:0; height:80vh; }
.pdf-frame { width:100%; height:100%; border:none; }
.progress-bar-wrap { height:6px; background:#e0e0e0; border-radius:3px; overflow:hidden; margin-bottom:4px; }
.progress-bar-inner { height:100%; background:#409EFF; border-radius:3px; transition:width 0.3s; }
.structure-info { padding:12px; background:#f0f7ff; border-radius:6px; margin-bottom:12px; font-size:13px; }
.structure-info .badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:12px; margin-right:4px; }
.structure-info .badge.folder { background:#67c23a; color:#fff; }
.structure-info .badge.flat { background:#409EFF; color:#fff; }
.structure-info .badge.warn { background:#e6a23c; color:#fff; }
</style>

<div id="app">
  <div class="toolbar">
    <span class="label">单位</span>
    <el-select v-model="form.unitId" placeholder="选择单位" filterable @change="onUnitChange">
      <el-option v-for="u in units" :key="u.序号" :label="u.单位" :value="u.序号"></el-option>
    </el-select>
    <span class="label">类别</span>
    <el-select v-model="form.fl" placeholder="类别" @change="onCategoryChange">
      <el-option v-for="c in topCategories" :key="c.fl" :label="c.jbbh + '：' + c.flsm" :value="c.fl"></el-option>
    </el-select>
    <el-select v-model="form.subFl" placeholder="子类别" v-if="subCategories.length">
      <el-option v-for="c in subCategories" :key="c.fl" :label="c.jbbh + '：' + c.flsm" :value="c.fl"></el-option>
    </el-select>
    <span class="label">年</span><el-input v-model.number="form.fyear" placeholder="年" style="width:70px"></el-input>
    <span class="label">月</span><el-input v-model.number="form.fmonth" placeholder="月" style="width:60px"></el-input>
    <span class="label">日</span><el-input v-model.number="form.fday" placeholder="日" style="width:60px"></el-input>
    <span class="label">材料</span><el-input v-model="form.cltm" placeholder="材料名称" class="wide"></el-input>
    <span class="label">页数</span><el-input v-model.number="form.ys" placeholder="页" style="width:60px"></el-input>
    <span class="label">备注</span><el-input v-model="form.bz" placeholder="备注" style="width:120px"></el-input>
    <el-button type="primary" size="small" @click="loadPersons" :disabled="!canSearch">加载人员</el-button>
    <el-button type="info" size="small" @click="detectStructure">检测文件</el-button>
    <el-button type="warning" size="small" @click="startOcr" :disabled="!canOcr">开始识别归类</el-button>
  </div>

  <div class="main-area">
    <div class="panel left-panel" ref="leftPanel">
      <div class="panel-header" v-if="personList.length">
        <h3>人员（[[ personList.length ]]人）</h3>
        <div>
          <el-button size="small" @click="selectAll">全选</el-button>
          <el-button size="small" @click="selectNone">全不选</el-button>
        </div>
      </div>
      <div class="panel-body" v-if="personList.length">
        <el-table :data="personList" @selection-change="onSelectionChange" ref="personTable" size="small">
          <el-table-column type="selection" width="40"></el-table-column>
          <el-table-column prop="name" label="姓名" width="80"></el-table-column>
          <el-table-column label="档案序号" width="90">
            <template #default="{ row }"><span v-if="row.archSeq!=='-'">[[ row.archSeq ]]</span><span v-else style="color:#c0c4cc;">-</span></template>
          </el-table-column>
          <el-table-column label="目录状态" width="100">
            <template #default="{ row }">
              <el-tag v-if="row.dirStatus==='未建'" type="info" size="small">未建</el-tag>
              <el-tag v-else-if="row.dirStatus.startsWith('正常')" type="success" size="small">[[ row.dirStatus ]]</el-tag>
              <el-tag v-else type="danger" size="small">[[ row.dirStatus ]]</el-tag>
            </template>
          </el-table-column>
          <el-table-column label="扫描状态" width="90">
            <template #default="{ row }">
              <span v-if="row.scanStatus==='--'" style="color:#c0c4cc;">--</span>
              <span v-else-if="row.scanStatus==='未扫'" style="color:#e6a23c;">未扫</span>
              <span v-else-if="row.scanStatus==='已完成'" style="color:#67c23a;">已完成</span>
              <span v-else-if="row.scanStatus==='异常'" style="color:#f56c6c;">异常</span>
              <span v-else>[[ row.scanStatus ]]</span>
            </template>
          </el-table-column>
          <el-table-column label="已匹配" width="60" align="center">
            <template #default="{ row }">
              <span v-if="row.matched" style="color:#67c23a;">✅</span>
              <span v-else style="color:#c0c4cc;">-</span>
            </template>
          </el-table-column>
          <el-table-column label="PDF" width="50" align="center">
            <template #default="{ row }">
              <el-button v-if="row.canPreview && row.records.length===1" size="small" @click="previewExistingPdf(row)">👁</el-button>
              <span v-else style="color:#c0c4cc;">-</span>
            </template>
          </el-table-column>
        </el-table>
      </div>
    </div>

    <div class="divider" ref="divider1" @mousedown="onDividerMouseDown($event, 'left')"></div>

    <div class="panel mid-panel" ref="midPanel">
      <div class="panel-header" v-if="results.length">
        <h3>识别结果（[[ results.length ]]份）</h3>
        <div>
          <el-button type="danger" size="small" @click="batchWrite" :disabled="!canWrite || writeLoading" :loading="writeLoading">批量写入（[[ writableCount ]]人）</el-button>
        </div>
      </div>
      <div class="panel-body" v-if="results.length">
        <el-table :data="results" stripe border size="small">
          <el-table-column type="index" label="#" width="35"></el-table-column>
          <el-table-column label="文件" width="150"><template #default="{ row }">[[ row.first_file ]]~[[ row.last_file ]]</template></el-table-column>
          <el-table-column prop="ocr_name" label="识别姓名" width="80"></el-table-column>
          <el-table-column prop="ocr_csny" label="出生年月" width="85"></el-table-column>
          <el-table-column label="匹配人员" width="80"><template #default="{ row }"><span v-if="row.matched_person">[[ row.matched_person.name ]]</span><el-tag v-else type="danger" size="small">?</el-tag></template></el-table-column>
          <el-table-column prop="match_by" label="匹配依据" width="130"></el-table-column>
          <el-table-column label="状态" width="60" align="center">
            <template #default="{ row }">
              <el-tag v-if="row._written" type="info" size="small">已写</el-tag>
              <el-tag v-else-if="row.match_status==='matched'" type="success" size="small">✓</el-tag>
              <el-tag v-else-if="row.match_status==='conflict'" type="warning" size="small">⚠</el-tag>
              <el-tag v-else type="danger" size="small">✗</el-tag>
            </template>
          </el-table-column>
          <el-table-column label="操作" width="190" fixed="right">
            <template #default="{ row }">
              <el-button size="small" @click="previewPdf(row)">预览</el-button>
              <el-button v-if="row.match_status==='matched' && !row._written" size="small" type="success" @click="singleWrite(row)" :loading="writeLoading">写入</el-button>
              <el-button v-if="row.match_status==='matched' && !row._written && row.match_by==='人工修正'" size="small" type="info" @click="undoMatch(row)">撤销</el-button>
              <el-button v-if="row.match_status!=='matched'" size="small" type="warning" @click="openSelect(row)">选人</el-button>
            </template>
          </el-table-column>
        </el-table>
      </div>
    </div>

    <div class="divider" ref="divider2" @mousedown="onDividerMouseDown($event, 'mid')"></div>

    <div class="panel right-panel" ref="rightPanel">
      <template v-if="results.length">
        <div class="right-section">
          <h4>识别统计</h4>
          <div v-if="progress.total" style="margin-bottom:16px;">
            <div style="display:flex;justify-content:space-between;font-size:12px;color:#909399;margin-bottom:4px;">
              <span>进度</span><span>[[ progress.done ]]/[[ progress.total ]]</span>
            </div>
            <div class="progress-bar-wrap">
              <div class="progress-bar-inner" :style="{width: progress.total ? (progress.done/progress.total*100)+'%' : '0%'}"></div>
            </div>
          </div>
          <div class="stat-cards">
            <div class="stat-card green"><span class="num">[[ stats.matched ]]</span>已匹配</div>
            <div class="stat-card yellow"><span class="num">[[ stats.conflict ]]</span>待确认</div>
            <div class="stat-card red"><span class="num">[[ stats.not_found ]]</span>未匹配</div>
          </div>
          <div v-if="writeResult" style="margin-top:16px;padding:12px;background:#f0f9eb;border-radius:4px;">
            <p style="color:#67c23a;font-weight:600;">写入完成</p>
            <p style="font-size:12px;color:#666;">成功 [[ writeResult.success ]] 人，失败 [[ writeResult.errors ]] 人</p>
          </div>
        </div>
      </template>
      <template v-else-if="ocrLoading">
        <div class="right-section" style="text-align:center;padding-top:60px;">
          <div class="loading-spinner"></div>
          <p style="margin-top:20px;font-size:15px;color:#303133;font-weight:600;">正在识别归类...</p>
        </div>
      </template>
      <template v-else-if="structureInfo">
        <div class="right-section">
          <h4>文件检测结果</h4>
          <div class="structure-info">
            <div v-if="structureInfo.structure==='folder'">
              <p><span class="badge folder">按人分文件夹</span></p>
              <p style="margin-top:8px;">检测到 <b>[[ structureInfo.count ]]</b> 个文件夹</p>
              <p style="font-size:12px;color:#909399;margin-top:4px;">文件夹名将与人员姓名精确匹配</p>
            </div>
            <div v-else-if="structureInfo.structure==='flat'">
              <p><span class="badge flat">平铺文件</span></p>
              <p style="margin-top:8px;">检测到 <b>[[ structureInfo.count ]]</b> 个文件</p>
              <p style="font-size:12px;color:#909399;margin-top:4px;">按页数分组，OCR识别第一页匹配人员</p>
            </div>
            <div v-else-if="structureInfo.structure==='mixed'">
              <p><span class="badge warn">混合结构</span></p>
              <p style="margin-top:8px;">文件夹 <b>[[ structureInfo.folder_count ]]</b> 个，文件 <b>[[ structureInfo.file_count ]]</b> 个</p>
              <p style="font-size:12px;color:#e6a23c;margin-top:4px;">请保持一种方式，避免混乱</p>
            </div>
            <div v-else>
              <p>未检测到文件，请将扫描件放入 AutoScan</p>
            </div>
          </div>
          <h4 style="margin-top:16px;">操作说明</h4>
          <div class="help-text">
            <p><b>方式A：按人分文件夹</b> <span class="success">（推荐）</span></p>
            <p class="highlight">AutoScan/张三/001.JPG</p>
            <p>文件夹名 = 人员姓名（必须精确）</p>
            <p style="margin-top:8px;"><b>方式B：平铺文件</b></p>
            <p class="highlight">AutoScan/IMG_001.jpg</p>
            <p>按页数自动分组，需确保顺序正确</p>
            <p style="margin-top:8px;"><span class="warn">⚠ 文件命名不规范时按创建时间排序</span></p>
          </div>
        </div>
      </template>
      <template v-else-if="personList.length">
        <div class="right-section">
          <h4>📋 功能说明</h4>
          <div class="help-text">
            <p>对未建目录的同材料进行批量扫描、OCR识别匹配、自动建目录（按日期排序）、写入扫描件。</p>
            <p style="margin-top:4px;"><span class="highlight">📌 适用：目录未建，需自动建档并写入扫描件</span></p>
          </div>
          <h4 style="margin-top:16px;">操作步骤</h4>
          <div class="help-text">
            <p>1. 点击 <b>"检测文件"</b> 查看文件结构</p>
            <p>2. 准备好扫描件后点击 <b>"开始识别归类"</b></p>
            <p>3. 校验识别结果，手动修正</p>
            <p>4. 点 <b>"写入"</b> 自动建目录并存盘</p>
            <p style="margin-top:12px;"><span class="warn">⚠ 写入：自动建档案目录（按日期排序）</span></p>
            <p style="margin-top:4px;"><span class="warn">   + 扫描件记录 + 加密存盘</span></p>
            <p style="margin-top:8px;"><span>📝 文件命名：001.JPG 或任意名</span></p>
            <p style="margin-top:4px;"><span>   （非标准格式按创建时间排序，建议使用标准格式）</span></p>
            <p style="margin-top:8px;"><span class="highlight">📁 推荐：AutoScan下按人分文件夹</span></p>
            <p class="highlight">   例：AutoScan/张三/001.JPG</p>
            <p style="margin-top:8px;"><span class="warn">⚠ 普通用户只能操作本单位</span></p>
          </div>
        </div>
      </template>
      <template v-else>
        <div class="right-section">
          <h4>📋 功能说明</h4>
          <div class="help-text">
            <p>对未建目录的同材料进行批量扫描、OCR识别匹配、自动建目录（按日期排序）、写入扫描件。</p>
            <p style="margin-top:4px;"><span class="highlight">📌 适用：目录未建，需自动建档并写入扫描件</span></p>
          </div>
          <h4 style="margin-top:16px;">快速开始</h4>
          <div class="help-text">
            <p>1. 选择<b>单位</b> + <b>类别</b> + <b>年月日</b></p>
            <p>2. 输入<b>材料名称</b> + <b>页数</b></p>
            <p>3. 点击<b>"加载人员"</b></p>
            <p style="margin-top:12px;"><span class="highlight">📁 推荐：AutoScan下按人分文件夹</span></p>
            <p class="highlight">   例：AutoScan/张三/001.JPG</p>
            <p style="margin-top:8px;"><span class="warn">⚠ 写入：自动建档案目录（按日期排序）</span></p>
            <p style="margin-top:4px;"><span class="warn">   + 扫描件记录 + 加密存盘</span></p>
            <p style="margin-top:8px;"><span>📝 文件命名：001.JPG 或任意名</span></p>
            <p style="margin-top:4px;"><span>   （非标准格式按创建时间排序，建议使用标准格式）</span></p>
            <p style="margin-top:8px;"><span class="warn">⚠ 普通用户只能操作本单位</span></p>
          </div>
        </div>
      </template>
    </div>
  </div>

  <el-dialog v-model="personDialog.visible" title="选择匹配人员" width="550px">
    <el-input v-model="personDialog.search" placeholder="搜索姓名（支持拼音）" size="small" clearable @input="onPersonSearch" style="margin-bottom:10px;"></el-input>
    <el-table :data="personDialog.candidates" @row-click="selectCandidate" highlight-current-row height="300" size="small" v-loading="personSearchLoading">
      <el-table-column prop="name" label="姓名" width="100"></el-table-column>
      <el-table-column prop="CSNY" label="出生年月" width="100"></el-table-column>
      <el-table-column prop="WORKTIME" label="参工时间" width="100"></el-table-column>
      <el-table-column prop="unit" label="单位" min-width="150"></el-table-column>
    </el-table>
    <template #footer>
      <el-button @click="personDialog.visible=false">取消</el-button>
      <el-button type="primary" @click="confirmCandidate">确定</el-button>
    </template>
  </el-dialog>

  <el-dialog v-model="pdfDialog.visible" title="PDF 预览" width="90%" top="3vh" class="pdf-dialog" @close="pdfDialog.url=''">
    <iframe v-if="pdfDialog.url" :src="pdfDialog.url" class="pdf-frame"></iframe>
  </el-dialog>
</div>

{% include "archives/image/ocr_batch_new_js.html" %}
{% endblock %}
