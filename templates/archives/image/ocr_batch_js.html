<!-- ocr_batch_js.html -->
<script>
(function(){
  const { createApp, ref, reactive, computed, onMounted, nextTick } = Vue;
  const { ElMessage } = ElementPlus;
  const app = createApp({
    setup(){
      var ocrLoading = ref(false);
      var form = reactive({unitId:null, fl:null, subFl:null, fyear:null, fmonth:null, fday:null, cltm:'', ys:null});
      var units=ref([]),topCategories=ref([]),subCategories=ref([]),personList=ref([]),personTable=ref(null),selectedPersons=ref([]),results=ref([]),unmatchedPersons=ref([]),ocrDone=ref(false),stats=reactive({matched:0,conflict:0,not_found:0}),personDialog=reactive({visible:false,candidates:[],targetRow:null,selected:null}),writeResult=ref(null);
      var pdfDialog=reactive({visible:false,url:''});
      var assignDialog=reactive({visible:false,title:'',items:[]});
      var leftPanel=ref(null),midPanel=ref(null),rightPanel=ref(null);
      var effectiveFl=computed(function(){return form.subFl||form.fl;});
      var canSearch=computed(function(){return form.unitId&&form.fl&&form.ys;});
      var canOcr=computed(function(){return canSearch.value&&personList.value.length>0;});
      var selectedCount=computed(function(){return selectedPersons.value.length;});
      var categoryLabel=computed(function(){var cat=topCategories.value.find(function(c){return c.fl===form.fl;});var name=cat?cat.jbbh+'\uFF1A'+cat.flsm:'';if(form.subFl){var sub=subCategories.value.find(function(c){return c.fl===form.subFl;});name+=' / '+(sub?sub.flsm:'');}return name;});
      var canWrite=computed(function(){return ocrDone.value&&stats.conflict===0&&stats.not_found===0&&selectedCount.value>0;});

      var onDividerMouseDown=function(e, side){
        e.preventDefault();
        var d=e.target, l, r, minL, minR;
        if(side==='left'){l=leftPanel.value;r=midPanel.value;minL=180;minR=350;}
        else{l=midPanel.value;r=rightPanel.value;minL=350;minR=180;}
        d.classList.add('active');document.body.style.cursor='col-resize';document.body.style.userSelect='none';
        var startX=e.clientX, startLW=l.offsetWidth, startRW=r.offsetWidth;
        var m=function(ev){var dx=ev.clientX-startX;var nl=startLW+dx,nr=startRW-dx;if(nl<minL){nl=minL;nr=startLW+startRW-minL;}if(nr<minR){nr=minR;nl=startLW+startRW-minR;}l.style.flex='none';l.style.width=nl+'px';r.style.flex='none';r.style.width=nr+'px';};
        var u=function(){d.classList.remove('active');document.body.style.cursor='';document.body.style.userSelect='';document.removeEventListener('mousemove',m);document.removeEventListener('mouseup',u);};
        document.addEventListener('mousemove',m);document.addEventListener('mouseup',u);
      };

      var loadUnits=async function(){try{var r=await axios.get('/archives/image/api/ocr-unit-list/');units.value=r.data.data||[];}catch(e){ElMessage.error('加载单位失败');}};
      var loadCategories=async function(){try{var r=await axios.get('/archives/image/api/ocr-category-tree/');topCategories.value=r.data.top||[];window._catChildren=r.data.children||{};}catch(e){ElMessage.error('加载类别失败');}};
      var onUnitChange=function(){personList.value=[];selectedPersons.value=[];ocrDone.value=false;results.value=[];writeResult.value=null;};
      var onCategoryChange=function(val){form.subFl=null;subCategories.value=(val===4||val===9)?(window._catChildren[val]||[]):[];};

      var loadPersons=async function(){
        if(!canSearch.value)return;ocrDone.value=false;results.value=[];writeResult.value=null;
        try{
          var r=await axios.get('/archives/image/api/ocr-unit-persons/',{params:{unit_id:form.unitId}});
          var rawList=r.data.data||[];
          var rsids=rawList.map(function(p){return p.RSID;}).join(',');
          var cr=await axios.get('/archives/image/api/ocr-existing-count/',{params:{rsids:rsids,fl:effectiveFl.value,cltm:form.cltm,fyear:form.fyear,fmonth:form.fmonth,fday:form.fday,ys:form.ys}});
          var archInfo=cr.data.data||{};
          personList.value=rawList.map(function(p){
            var info=archInfo[p.RSID]||{exists:false,records:[],person:{}};
            var recs=info.records||[],person=info.person||{};
            var dirStatus=recs.length===0?'未建':(recs.length===1?'正常（1条）':'异常（'+recs.length+'条）');
            var archSeq='-';
            if(recs.length===1){archSeq=(topCategories.value.find(function(c){return c.fl===effectiveFl.value;})||{}).jbbh||'';archSeq=archSeq+'-'+recs[0].XH;}
            else if(recs.length>1){var jbbh=(topCategories.value.find(function(c){return c.fl===effectiveFl.value;})||{}).jbbh||'';archSeq=recs.map(function(rr){return jbbh+'-'+rr.XH;}).join(', ');}
            var scanStatus='--';
            if(recs.length===1){var r0=recs[0];if(r0.uploaded===0)scanStatus='未扫';else if(r0.uploaded>=r0.YS)scanStatus='已完成';else scanStatus='已扫 '+r0.uploaded+'/'+r0.YS;}
            else if(recs.length>1)scanStatus='异常';
            return {RSID:p.RSID,name:person.name||p.name||'',dirStatus:dirStatus,scanStatus:scanStatus,archSeq:archSeq,records:recs,canPreview:recs.length===1,canSelect:recs.length>1};
          });
          nextTick(function(){if(personTable.value)personList.value.forEach(function(rr){personTable.value.toggleRowSelection(rr,true);});});
          ElMessage.success('已加载 '+personList.value.length+' 人');
        }catch(e){ElMessage.error('加载人员失败');}
      };

      var onSelectionChange=function(val){selectedPersons.value=val;};
      var selectAll=function(){if(personTable.value)personList.value.forEach(function(r){personTable.value.toggleRowSelection(r,true);});};
      var selectNone=function(){if(personTable.value)personTable.value.clearSelection();};

      var startOcr=async function(){
        ocrLoading.value=true;writeResult.value=null;
        try{
          var r=await axios.get('/archives/image/api/ocr-verify/',{params:{pages:form.ys,unit_id:form.unitId}});
          var d=r.data.data;results.value=d.items;unmatchedPersons.value=d.unmatched_persons;
          stats.matched=d.stats.matched;stats.conflict=d.stats.conflict;stats.not_found=d.stats.not_found;ocrDone.value=true;
          for(var i=0;i<results.value.length;i++){var item=results.value[i];if(item.matched_person){try{var cr=await axios.get('/archives/image/api/ocr-existing-count/',{params:{rsids:String(item.matched_person.RSID),fl:effectiveFl.value,cltm:form.cltm,fyear:form.fyear,fmonth:form.fmonth,fday:form.fday,ys:form.ys}});var info=cr.data.data[item.matched_person.RSID];if(info&&info.records&&info.records.length===1){item.archid=info.records[0].ARCHID;var jbbh=(topCategories.value.find(function(c){return c.fl===form.fl;})||{}).jbbh||'';item.arch_seq=jbbh+'-'+info.records[0].XH;}}catch(e){}}}
        }catch(e){ElMessage.error('OCR识别失败');}
        finally{ocrLoading.value=false;}
      };

      var previewPdf=function(row){pdfDialog.url='/archives/image/api/ocr-preview-pdf/?files='+encodeURIComponent(JSON.stringify(row.files));pdfDialog.visible=true;};
      var previewExistingPdf=function(row){if(row.records&&row.records.length===1){var r0=row.records[0];pdfDialog.url='/archives/image/api/ocr-preview-pdf/?rsid='+row.RSID+'&archid='+r0.ARCHID+'&fl='+effectiveFl.value;pdfDialog.visible=true;}};

      var openSelect=function(row){personDialog.candidates=row.candidates.length?row.candidates:personList.value;personDialog.targetRow=row;personDialog.selected=null;personDialog.visible=true;};
      var selectCandidate=function(row){personDialog.selected=row;};
      var confirmCandidate=function(){
        if(personDialog.selected&&personDialog.targetRow){
          personDialog.targetRow.matched_person={RSID:personDialog.selected.RSID,name:personDialog.selected.name};
          personDialog.targetRow.match_status='matched';personDialog.targetRow.match_by='人工修正';
          stats.matched++;if(stats.conflict>0)stats.conflict--;if(stats.not_found>0)stats.not_found--;
          unmatchedPersons.value=unmatchedPersons.value.filter(function(p){return p.RSID!==personDialog.selected.RSID;});
        }
        personDialog.visible=false;
      };

      var showConflictList=function(){
        var items=results.value.filter(function(r){return r.match_status==='conflict';});
        assignDialog.title='待确认（'+items.length+'份）';
        assignDialog.items=items;
        assignDialog.visible=true;
      };
      var showUnmatchedList=function(){
        var items=results.value.filter(function(r){return r.match_status==='not_found';});
        assignDialog.title='未匹配（'+items.length+'份）';
        assignDialog.items=items;
        assignDialog.visible=true;
      };
      var showMatchedList=function(){
        ElMessage.info('已匹配 '+stats.matched+' 份，请查看中间表格');
      };
      var assignDialogSelect=function(row){if(row.match_status!=='matched')openSelect(row);};
      var quickAssign=function(row, candidate){
        row.matched_person={RSID:candidate.RSID,name:candidate.name};
        row.match_status='matched';row.match_by='人工修正';
        stats.matched++;if(row.match_status==='conflict')stats.conflict--;else stats.not_found--;
        unmatchedPersons.value=unmatchedPersons.value.filter(function(p){return p.RSID!==candidate.RSID;});
      };

      var batchWrite=async function(){
        var items=results.value.filter(function(r){return r.matched_person&&r.archid&&selectedPersons.value.some(function(p){return p.RSID===r.matched_person.RSID;});}).map(function(r){return{rsid:r.matched_person.RSID,archid:r.archid,files:r.files,ocr_name:r.ocr_name,ocr_csny:r.ocr_csny,ocr_text:r.ocr_text,match_by:r.match_by};});
        if(!items.length){ElMessage.warning('没有可写入的匹配结果');return;}
        try{var payload={items:items,fl:effectiveFl.value,cltm:form.cltm,fyear:form.fyear,fmonth:form.fmonth,fday:form.fday,ys:form.ys};var r=await axios.post('/archives/image/api/ocr-batch-write/',payload);writeResult.value={success:r.data.success||items.length,errors:r.data.errors||0};ElMessage.success(r.data.msg);}catch(e){ElMessage.error('写入失败');}
      };

      onMounted(function(){loadUnits();loadCategories();});
      return {ocrLoading,form,units,topCategories,subCategories,personList,personTable,selectedPersons,results,unmatchedPersons,ocrDone,stats,personDialog,writeResult,pdfDialog,assignDialog,leftPanel,midPanel,rightPanel,effectiveFl,categoryLabel,canSearch,canOcr,selectedCount,canWrite,onDividerMouseDown,loadUnits,loadCategories,onUnitChange,onCategoryChange,loadPersons,onSelectionChange,selectAll,selectNone,startOcr,previewPdf,previewExistingPdf,openSelect,selectCandidate,confirmCandidate,showConflictList,showUnmatchedList,showMatchedList,assignDialogSelect,quickAssign,batchWrite};
    }
  });
  app.config.compilerOptions.delimiters=['[[',']]'];
  app.use(ElementPlus,{locale:ElementPlusLocaleZhCn}).mount('#app');
})();
</script>
