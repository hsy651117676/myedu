<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script src="/static/lib/vue.global.prod.js"></script>
  <script src="/static/lib/opencv.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-size:12px; overflow:hidden; height:100vh; display:flex; flex-direction:column; background:#fff; }
    .toolbox { display:flex; flex-direction:column; gap:3px; padding:4px; overflow-y:auto; flex:1; }
    .toolbox button { padding:4px 6px; font-size:11px; cursor:pointer; border:1px solid #dcdfe6; border-radius:3px; background:#fff; }
    .toolbox button:hover { border-color:#409EFF; color:#409EFF; }
    .toolbox button:disabled { opacity:0.5; cursor:not-allowed; }
    .toolbox button.primary { background:#409EFF; color:#fff; border:none; }
    .toolbox button.danger { background:#f56c6c; color:#fff; border:none; }
    .toolbox .section { font-weight:bold; color:#606266; margin-top:6px; margin-bottom:1px; }
    .toolbox label { display:flex; align-items:center; gap:2px; white-space:nowrap; }
    .toolbox .progress-wrap { width:100%; height:4px; background:#e0e0e0; border-radius:2px; margin-top:4px; display:none; }
    .toolbox .progress-bar { background:#409EFF; height:100%; border-radius:2px; width:0%; transition:width 0.2s; }
    .toolbox .status-text { color:#909399; text-align:center; margin-top:4px; min-height:16px; }
  </style>
</head>
<body>
<div id="app">
  <div class="toolbox">
    <div class="section">手动修图</div>
    <button @click="rotateLeft" :disabled="!hasFile">↺ 左旋90°</button>
    <button @click="rotateRight" :disabled="!hasFile">↻ 右旋90°</button>
    <button @click="flipH" :disabled="!hasFile">⇔ 水平翻转</button>
    <button @click="flipV" :disabled="!hasFile">⇕ 垂直翻转</button>
    <button @click="brightUp" :disabled="!hasFile">☀ 亮度+</button>
    <button @click="brightDown" :disabled="!hasFile">☁ 亮度-</button>
    <button @click="contrastUp" :disabled="!hasFile">◐ 对比度+</button>
    <button @click="contrastDown" :disabled="!hasFile">◑ 对比度-</button>
    <button @click="undo" :disabled="!hasFile">↩ 撤销</button>
    <button @click="resetEdit" :disabled="!hasFile">⟳ 重置</button>

    <div class="section">自动修图</div>
    <label><input type="checkbox" v-model="params.autoCrop"> 自动裁剪</label>
    <label><input type="checkbox" v-model="params.deskew"> 自动纠偏</label>
    <label><input type="checkbox" v-model="params.gray"> 灰度化</label>
    <label><input type="checkbox" v-model="params.contrast"> 增强对比度</label>
    <label><input type="checkbox" v-model="params.denoise"> 去噪（慢）</label>

    <div class="section">操作</div>
    <button class="primary" @click="previewCurrent" :disabled="!hasFile || processing">👁 预览修图</button>
    <button class="primary" @click="processCurrent" :disabled="!hasFile || processing">✏️ 修当前图</button>
    <button class="primary" @click="processAll" :disabled="!fileList.length || processing">
      [[ processing ? '⏳ ' + progressText : '🚀 全部修图' ]]
    </button>
    <button class="danger" @click="saveAll" :disabled="!processedCount">💾 保存</button>

    <div class="progress-wrap" :style="{display: processing ? 'block' : 'none'}">
      <div class="progress-bar" :style="{width: progressPercent+'%'}"></div>
    </div>
    <div class="status-text">[[ statusText ]]</div>
  </div>
</div>

<script>
(function(){
  const { createApp, ref, reactive } = Vue;

  const app = createApp({
    delimiters: ['[[', ']]'],
    setup(){
      const currentFile = ref(null);
      const currentFileName = ref('');
      const hasFile = ref(false);
      const fileList = ref([]);
      const processedBlobs = ref({});
      const processedCount = ref(0);
      const processing = ref(false);
      const progressPercent = ref(0);
      const progressText = ref('');
      const statusText = ref('等待图片...');
      
      const editCanvas = ref(null);
      const editHistory = ref([]);
      const cachedResult = ref(null);

      const params = reactive({
        autoCrop: true, deskew: true, gray: true, contrast: true, denoise: false
      });

      let cvReady = false;

      // 真正可用的检测
      const checkCV = () => {
        try {
          if (typeof cv === 'undefined') return false;
          if (!cv.Mat || !cv.Mat.prototype) return false;
          // 实际创建一个Mat测试WASM函数是否可用
          const test = new cv.Mat();
          test.delete();
          return true;
        } catch(e) {
          return false;
        }
      };

      const waitForCV = () => new Promise((resolve) => {
        if (checkCV()) { cvReady = true; resolve(); return; }
        
        if (typeof Module !== 'undefined') {
          const orig = Module.onRuntimeInitialized;
          Module.onRuntimeInitialized = function() {
            if (orig) orig();
            setTimeout(() => {
              if (checkCV()) { cvReady = true; resolve(); }
              else {
                // 再等
                const retry = setInterval(() => {
                  if (checkCV()) { clearInterval(retry); cvReady = true; resolve(); }
                }, 200);
              }
            }, 300);
          };
          if (Module.calledRun) {
            const retry = setInterval(() => {
              if (checkCV()) { clearInterval(retry); cvReady = true; resolve(); }
            }, 200);
          }
          return;
        }
        
        const check = setInterval(() => {
          if (checkCV()) { clearInterval(check); cvReady = true; resolve(); }
        }, 200);
      });

      const ensureCV = async () => {
        if (cvReady) return true;
        try {
          await waitForCV();
          return cvReady;
        } catch(e) {
          return false;
        }
      };

      const postMsg = (msg) => window.parent.postMessage(msg, '*');
      const setStatus = (text) => { statusText.value = text; postMsg({ type: 'process-status', text }); };

      window.addEventListener('message', (e) => {
        if (e.data.type === 'set-file') {
          currentFile.value = e.data.file;
          currentFileName.value = e.data.fileName;
          hasFile.value = true;
          editCanvas.value = null;
          editHistory.value = [];
          cachedResult.value = null;
          setStatus('已加载：' + e.data.fileName);
          postMsg({ type: 'preview-update', url: null });
        }
        if (e.data.type === 'set-file-list') {
          fileList.value = e.data.list || [];
        }
        if (e.data.type === 'reset') {
          currentFile.value = null;
          currentFileName.value = '';
          hasFile.value = false;
          editCanvas.value = null;
          editHistory.value = [];
          cachedResult.value = null;
          processedBlobs.value = {};
          processedCount.value = 0;
          setStatus('等待图片...');
          postMsg({ type: 'preview-update', url: null });
        }
        if (e.data.type === 'save-done') {
          if (e.data.success) {
            setStatus(`保存完成：${e.data.count} 个文件`);
          } else {
            setStatus('保存失败：' + (e.data.msg || ''));
          }
        }
      });

      const fileToImage = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => { 
          const img = new Image(); 
          img.onload = () => resolve(img); 
          img.onerror = () => reject(new Error('图片加载失败'));
          img.src = e.target.result; 
        };
        reader.onerror = () => reject(new Error('文件读取失败'));
        reader.readAsDataURL(file);
      });

      const imageToCanvas = (img) => {
        const c = document.createElement('canvas');
        const maxW = 1500;
        let w = img.naturalWidth || img.width;
        let h = img.naturalHeight || img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        c.width = w; c.height = h;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, w, h);
        return c;
      };

      const canvasToBlobUrl = async (canvas) => {
        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 92));
        return { url: URL.createObjectURL(blob), blob };
      };

      const getEditCanvas = async () => {
        if (editCanvas.value) return editCanvas.value;
        if (!currentFile.value) return null;
        try {
          const img = await fileToImage(currentFile.value);
          editCanvas.value = imageToCanvas(img);
          saveHistory();
          return editCanvas.value;
        } catch(e) { return null; }
      };

      const saveHistory = () => {
        if (!editCanvas.value) return;
        const clone = document.createElement('canvas');
        clone.width = editCanvas.value.width; 
        clone.height = editCanvas.value.height;
        const ctx = clone.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(editCanvas.value, 0, 0);
        editHistory.value.push(clone);
        if (editHistory.value.length > 20) editHistory.value.shift();
      };

      const applyEdit = async (fn) => {
        const canvas = await getEditCanvas();
        if (!canvas) return;
        saveHistory();
        fn(canvas);
        cachedResult.value = null;
        const result = await canvasToBlobUrl(canvas);
        postMsg({ type: 'preview-update', url: result.url });
      };

      const rotateLeft = () => applyEdit((c) => { 
        const ctx=c.getContext('2d'); 
        const d=ctx.getImageData(0,0,c.width,c.height);
        const nc=document.createElement('canvas');
        nc.width=c.height; nc.height=c.width;
        const nctx=nc.getContext('2d');
        nctx.translate(0,nc.height); nctx.rotate(-Math.PI/2);
        nctx.putImageData(d,0,0);
        c.width=nc.width; c.height=nc.height;
        ctx.drawImage(nc,0,0);
      });

      const rotateRight = () => applyEdit((c) => { 
        const ctx=c.getContext('2d'); 
        const d=ctx.getImageData(0,0,c.width,c.height);
        const nc=document.createElement('canvas');
        nc.width=c.height; nc.height=c.width;
        const nctx=nc.getContext('2d');
        nctx.translate(nc.width,0); nctx.rotate(Math.PI/2);
        nctx.putImageData(d,0,0);
        c.width=nc.width; c.height=nc.height;
        ctx.drawImage(nc,0,0);
      });

      const flipH = () => applyEdit((c) => { 
        const ctx=c.getContext('2d'); 
        ctx.translate(c.width,0); ctx.scale(-1,1); 
        ctx.drawImage(c,0,0); ctx.setTransform(1,0,0,1,0,0); 
      });

      const flipV = () => applyEdit((c) => { 
        const ctx=c.getContext('2d'); 
        ctx.translate(0,c.height); ctx.scale(1,-1); 
        ctx.drawImage(c,0,0); ctx.setTransform(1,0,0,1,0,0); 
      });

      const adjustBrightness = (delta) => applyEdit((c) => {
        const ctx=c.getContext('2d', { willReadFrequently: true }); 
        const d=ctx.getImageData(0,0,c.width,c.height);
        for(let i=0;i<d.data.length;i+=4){ 
          d.data[i]=Math.min(255,Math.max(0,d.data[i]+delta)); 
          d.data[i+1]=Math.min(255,Math.max(0,d.data[i+1]+delta)); 
          d.data[i+2]=Math.min(255,Math.max(0,d.data[i+2]+delta)); 
        }
        ctx.putImageData(d,0,0);
      });

      const adjustContrast = (factor) => applyEdit((c) => {
        const ctx=c.getContext('2d', { willReadFrequently: true }); 
        const d=ctx.getImageData(0,0,c.width,c.height);
        for(let i=0;i<d.data.length;i+=4){ 
          d.data[i]=(d.data[i]-128)*factor+128; 
          d.data[i+1]=(d.data[i+1]-128)*factor+128; 
          d.data[i+2]=(d.data[i+2]-128)*factor+128; 
        }
        ctx.putImageData(d,0,0);
      });

      const brightUp = () => adjustBrightness(20);
      const brightDown = () => adjustBrightness(-20);
      const contrastUp = () => adjustContrast(1.3);
      const contrastDown = () => adjustContrast(0.7);

      const undo = async () => {
        if (editHistory.value.length === 0) return;
        editCanvas.value = editHistory.value.pop();
        cachedResult.value = null;
        const result = await canvasToBlobUrl(editCanvas.value);
        postMsg({ type: 'preview-update', url: result.url });
      };

      const resetEdit = async () => {
        editCanvas.value = null; 
        editHistory.value = [];
        cachedResult.value = null;
        postMsg({ type: 'preview-update', url: null });
      };
const processWithCV = async (file) => {
    const ready = await ensureCV();
    const img = await fileToImage(file);
    let canvas = imageToCanvas(img);
    
    if (!ready) return canvas;
    
    try {
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        
        // 手动创建 Mat，不用 matFromImageData
        let mat = new cv.Mat(canvas.height, canvas.width, cv.CV_8UC4);
        mat.data.set(imageData.data);
        
        if (!mat || mat.empty()) {
            console.warn('Mat创建失败，返回原图');
            return canvas;
        }
        
        // 转换 RGBA -> BGR（OpenCV 默认 BGR）
        const bgr = new cv.Mat();
        cv.cvtColor(mat, bgr, cv.COLOR_RGBA2BGR);
        mat.delete();
        mat = bgr;
        
        if (params.gray) {
            const gray = new cv.Mat(); 
            cv.cvtColor(mat, gray, cv.COLOR_BGR2GRAY);
            mat.delete(); 
            mat = gray;
            // 转回 BGR 以便后续处理
            const bgr2 = new cv.Mat();
            cv.cvtColor(mat, bgr2, cv.COLOR_GRAY2BGR);
            mat.delete();
            mat = bgr2;
        }
        
        if (params.contrast) {
            const ycrcb = new cv.Mat(); 
            cv.cvtColor(mat, ycrcb, cv.COLOR_BGR2YCrCb);
            const channels = new cv.MatVector(); 
            cv.split(ycrcb, channels);
            cv.equalizeHist(channels.get(0), channels.get(0)); 
            cv.merge(channels, ycrcb);
            cv.cvtColor(ycrcb, mat, cv.COLOR_YCrCb2BGR); 
            ycrcb.delete(); 
            channels.delete();
        }
        
        if (params.autoCrop) {
            const gray2 = new cv.Mat(); 
            cv.cvtColor(mat, gray2, cv.COLOR_BGR2GRAY);
            const binary = new cv.Mat(); 
            cv.threshold(gray2, binary, 240, 255, cv.THRESH_BINARY_INV);
            const contours = new cv.MatVector(); 
            const hierarchy = new cv.Mat();
            cv.findContours(binary, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
            if (contours.size() > 0) {
                let maxArea = 0, maxIdx = 0;
                for (let i=0;i<contours.size();i++) { 
                    const a=cv.contourArea(contours.get(i)); 
                    if(a>maxArea){maxArea=a;maxIdx=i;} 
                }
                const rect = cv.boundingRect(contours.get(maxIdx));
                if (rect.width>50 && rect.height>50) { 
                    const cropped=mat.roi(rect); 
                    const clone=cropped.clone(); 
                    mat.delete(); 
                    mat=clone; 
                    cropped.delete(); 
                }
            }
            gray2.delete(); binary.delete(); contours.delete(); hierarchy.delete();
        }
        
        if (params.deskew) {
            const gray3 = new cv.Mat(); 
            cv.cvtColor(mat, gray3, cv.COLOR_BGR2GRAY);
            const edges = new cv.Mat(); 
            cv.Canny(gray3, edges, 50, 200);
            const lines = new cv.Mat(); 
            cv.HoughLines(edges, lines, 1, Math.PI/180, 100);
            if (lines.rows > 0) {
                let totalAngle = 0, count = 0;
                for (let i=0;i<Math.min(lines.rows,20);i++) {
                    const theta = lines.data32F[i*2+1]; 
                    const angle = theta*180/Math.PI;
                    if (angle>85&&angle<95) continue; 
                    const skew = angle>90?angle-180:angle;
                    if (Math.abs(skew)<30) { totalAngle+=skew; count++; }
                }
                if (count>0) {
                    const avgAngle = totalAngle/count;
                    const center = new cv.Point(mat.cols/2, mat.rows/2);
                    const rotMat = cv.getRotationMatrix2D(center, avgAngle, 1.0);
                    const rotated = new cv.Mat();
                    cv.warpAffine(mat, rotated, rotMat, new cv.Size(mat.cols, mat.rows), cv.INTER_CUBIC, cv.BORDER_REPLICATE);
                    mat.delete(); mat = rotated; rotMat.delete();
                }
            }
            gray3.delete(); edges.delete(); lines.delete();
        }
        
        if (params.denoise) {
            try {
                const denoised = new cv.Mat(); 
                cv.fastNlMeansDenoisingColored(mat, denoised, 3, 3, 7, 21);
                mat.delete(); 
                mat = denoised;
            } catch(e) {
                console.warn('去噪不支持，已跳过');
            }
        }
        
        // 转回 RGBA
        const rgba = new cv.Mat();
        cv.cvtColor(mat, rgba, cv.COLOR_BGR2RGBA);
        mat.delete();
        mat = rgba;
        
        // 画回 canvas
        canvas.width = mat.cols;
        canvas.height = mat.rows;
        const outCtx = canvas.getContext('2d', { willReadFrequently: true });
        outCtx.putImageData(new ImageData(new Uint8ClampedArray(mat.data), mat.cols, mat.rows), 0, 0);
        mat.delete();
        
    } catch(e) {
        console.error('OpenCV处理出错，返回原图:', e.message);
    }
    
    return canvas;
};

      const previewCurrent = async () => {
        if (!currentFile.value) return;
        setStatus('正在处理...');
        try {
          if (cachedResult.value) {
            postMsg({ type: 'preview-update', url: cachedResult.value.url });
            setStatus('预览（缓存）');
            return;
          }
          if (editCanvas.value) {
            const result = await canvasToBlobUrl(editCanvas.value);
            postMsg({ type: 'preview-update', url: result.url });
            setStatus('预览');
            return;
          }
          const canvas = await processWithCV(currentFile.value);
          if (!canvas) { setStatus('处理失败'); return; }
          const result = await canvasToBlobUrl(canvas);
          cachedResult.value = result;
          postMsg({ type: 'preview-update', url: result.url });
          setStatus('预览完成');
        } catch(e) {
          console.error('预览失败:', e);
          setStatus('预览失败: ' + e.message);
        }
      };

      const processCurrent = async () => {
        if (!currentFile.value) return;
        setStatus('正在修图...');
        processing.value = true;
        try {
          let canvas;
          if (editCanvas.value) {
            canvas = editCanvas.value;
          } else if (cachedResult.value) {
            const img = await fileToImage(new File([await cachedResult.value.blob.arrayBuffer()], currentFileName.value));
            canvas = imageToCanvas(img);
          } else {
            canvas = await processWithCV(currentFile.value);
          }
          if (!canvas) { setStatus('处理失败'); return; }
          const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 92));
          processedBlobs.value[currentFileName.value] = blob;
          processedCount.value = Object.keys(processedBlobs.value).length;
          cachedResult.value = { url: URL.createObjectURL(blob), blob };
          postMsg({ type: 'preview-update', url: cachedResult.value.url });
          postMsg({ type: 'process-done', fileName: currentFileName.value });
          setStatus('修图完成');
        } catch(e) {
          console.error('修图失败:', e);
          setStatus('修图失败: ' + e.message);
        } finally {
          processing.value = false;
        }
      };

      const processAll = async () => {
        if (!fileList.value.length) return;
        processing.value = true;
        let done = 0;
        const total = fileList.value.length;
        
        for (let i = 0; i < fileList.value.length; i++) {
          const item = fileList.value[i];
          progressPercent.value = Math.round(done / total * 100);
          progressText.value = `${done}/${total}`;
          setStatus(`处理中：${item.name} (${done+1}/${total})`);
          
          try {
            let file;
            if (item.handle) {
              file = await item.handle.getFile();
            }
            if (!file) continue;
            
            const canvas = await processWithCV(file);
            if (!canvas) continue;
            const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 92));
            processedBlobs.value[item.name] = blob;
            done++;
            postMsg({ type: 'process-done', fileName: item.name });
          } catch(e) {
            console.error('处理失败:', item.name, e);
          }
        }
        
        processedCount.value = Object.keys(processedBlobs.value).length;
        progressPercent.value = 100;
        progressText.value = `${done}/${total}`;
        setStatus(`全部完成：${done}/${total}`);
        processing.value = false;
      };

      const saveAll = () => {
        const blobs = Object.keys(processedBlobs.value).map(name => ({
          name, blob: processedBlobs.value[name]
        }));
        if (!blobs.length) { setStatus('没有可保存的文件'); return; }
        setStatus('正在保存...');
        postMsg({ type: 'save-request', blobs });
      };

      // 初始化
      waitForCV();

      return {
        currentFile, currentFileName, hasFile, fileList,
        processedBlobs, processedCount, processing,
        progressPercent, progressText, statusText, params,
        rotateLeft, rotateRight, flipH, flipV,
        brightUp, brightDown, contrastUp, contrastDown,
        undo, resetEdit, previewCurrent, processCurrent, processAll, saveAll
      };
    }
  });

  app.mount('#app');
})();
</script>
</body>
</html>
