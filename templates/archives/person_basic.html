{% extends "layout/base.html" %}
{% block title %}基本信息{% endblock %}

{% block content %}
  <div id="app" v-if="rsid" style="padding:10px;font-size:15px;overflow-y:auto;height:100%;">

  <div style="position:sticky;top:0;z-index:10;background:#fff;padding:6px 0;margin-bottom:10px;border-bottom:1px solid #e4e7ed;display:flex;justify-content:flex-end;">
    <el-button type="primary" @click="show_image">查看档案扫描</el-button>
    <el-button type="primary" @click="saveBasic">保存</el-button>
  </div>

  <div style="display:flex;gap:16px;">
    <div style="flex:1;">
      <el-descriptions :column="4" border>
        <el-descriptions-item label="姓名"><el-input v-model="detail.姓名"/></el-descriptions-item>
        <el-descriptions-item label="性别">
          <el-select v-model="detail.性别"><el-option label="男" value="男"/><el-option label="女" value="女"/></el-select>
        </el-descriptions-item>
        <el-descriptions-item label="民族">
          <el-select v-model="detail.民族" filterable>
            <el-option v-for="v in mzOptions" :key="v" :label="v" :value="v"/>
          </el-select>
        </el-descriptions-item>
        <el-descriptions-item label="出生地"><el-input v-model="detail.出生地"/></el-descriptions-item>
        <el-descriptions-item label="籍贯"><el-input v-model="detail.籍贯"/></el-descriptions-item>
        <el-descriptions-item label="人员状态">
          <el-select v-model="detail.人员状态">
            <el-option v-for="v in ryztOptions" :key="v" :label="v" :value="v"/>
          </el-select>
        </el-descriptions-item>
        <el-descriptions-item label="出生年月"><el-input v-model="detail.出生年月" placeholder="yyyyMM"/></el-descriptions-item>
        <el-descriptions-item label="年龄"><span style="color:#909399;">[[ detail.年龄 ]]</span></el-descriptions-item>
        <el-descriptions-item label="参工时间"><el-input v-model="detail.参工时间" placeholder="yyyyMM"/></el-descriptions-item>
        <el-descriptions-item label="工龄"><span style="color:#909399;">[[ detail.工龄 ]]</span></el-descriptions-item>
        <el-descriptions-item label="政治面貌">
          <el-select v-model="detail.政治面貌" filterable>
            <el-option v-for="v in zzmmOptions" :key="v" :label="v" :value="v"/>
          </el-select>
        </el-descriptions-item>
        <el-descriptions-item label="入党时间"><el-input v-model="detail.入党时间"/></el-descriptions-item>
        <el-descriptions-item label="工作单位及职务" :span="4"><el-input v-model="detail.工作单位及职务"/></el-descriptions-item>
        <el-descriptions-item label="任职时间"><el-input v-model="detail.任职时间"/></el-descriptions-item>
        <el-descriptions-item label="领导职务"><el-input v-model="detail.领导职务"/></el-descriptions-item>
        <el-descriptions-item label="是否中层干部"><el-input v-model="detail.是否中层干部"/></el-descriptions-item>
        <el-descriptions-item label="现任职称"><el-input v-model="detail.现任职称"/></el-descriptions-item>
        <el-descriptions-item label="身份证号"><el-input v-model="detail.身份证号"/></el-descriptions-item>
        <el-descriptions-item label="人员身份"><span style="color:#909399;">[[ detail.人员身份 ]]</span></el-descriptions-item>
        <el-descriptions-item label="最高学历"><span style="color:#909399;">[[ detail.最高学历 ]]</span></el-descriptions-item>
        <el-descriptions-item label="联系电话"><el-input v-model="detail.联系电话"/></el-descriptions-item>
        <el-descriptions-item label="档案编号"><span style="color:#909399;">[[ detail.档案编号 ]]</span></el-descriptions-item>
        <el-descriptions-item label="柜号"><span style="color:#909399;">[[ detail.柜号 ]]</span></el-descriptions-item>
        <el-descriptions-item label="层号"><span style="color:#909399;">[[ detail.层号 ]]</span></el-descriptions-item>
        <el-descriptions-item label="退休时间"><el-input v-model="detail.退休时间"/></el-descriptions-item>
        <el-descriptions-item label="去世时间"><el-input v-model="detail.去世时间"/></el-descriptions-item>
        <el-descriptions-item label="工龄是否间断"><el-input v-model="detail.工龄是否间断"/></el-descriptions-item>
        <el-descriptions-item label="是否受过处分" :span="4"><el-input v-model="detail.是否受过处分" type="textarea" :rows="2"/></el-descriptions-item>
        <el-descriptions-item label="近三年考核" :span="3"><el-input v-model="detail.近三年考核"/></el-descriptions-item>
        <el-descriptions-item label="健康状况"><el-input v-model="detail.健康状况" placeholder="健康或良好"/></el-descriptions-item>
      </el-descriptions>
    </div>
    <div style="width:120px;text-align:center;flex-shrink:0;">
      <img v-if="detail.照片" :src="detail.照片" style="width:110px;height:140px;border:1px solid #ddd;object-fit:cover;cursor:pointer;" @click="uploadPhoto">
      <div v-else style="width:110px;height:140px;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;color:#ccc;cursor:pointer;" @click="uploadPhoto">无照片</div>
      <div style="font-size:12px;color:#409EFF;margin-top:4px;cursor:pointer;" @click="uploadPhoto">更换照片</div>
      <input type="file" ref="photoInput" accept="image/*" style="display:none;" @change="handlePhotoChange">
    </div>
  </div>

  <div style="font-weight:bold;font-size:17px;border-bottom:2px solid #409EFF;padding-bottom:4px;margin:24px 0 12px 0;">学历信息</div>
  <el-row :gutter="12">
    <el-col :span="12">
      <div style="font-weight:bold;font-size:15px;margin-bottom:6px;color:#606266;">全日制教育</div>
      <el-descriptions :column="2" border>
        <el-descriptions-item label="学历"><el-input v-model="detail.全日制学历"/></el-descriptions-item>
        <el-descriptions-item label="毕业院校系"><el-input v-model="detail.全日制学校"/></el-descriptions-item>
        <el-descriptions-item label="专业"><el-input v-model="detail.全日制专业"/></el-descriptions-item>
        <el-descriptions-item label="入学时间"><el-input v-model="detail.全日制入学" placeholder="yyyyMM"/></el-descriptions-item>
        <el-descriptions-item label="毕业时间"><el-input v-model="detail.全日制毕业" placeholder="yyyyMM"/></el-descriptions-item>
        <el-descriptions-item label="学位"><el-input v-model="detail.全日制学位"/></el-descriptions-item>
      </el-descriptions>
    </el-col>
    <el-col :span="12">
      <div style="font-weight:bold;font-size:15px;margin-bottom:6px;color:#606266;">在职教育</div>
      <el-descriptions :column="2" border>
        <el-descriptions-item label="学历"><el-input v-model="detail.在职学历"/></el-descriptions-item>
        <el-descriptions-item label="毕业院校系"><el-input v-model="detail.在职学校"/></el-descriptions-item>
        <el-descriptions-item label="专业"><el-input v-model="detail.在职专业"/></el-descriptions-item>
        <el-descriptions-item label="入学时间"><el-input v-model="detail.在职入学" placeholder="yyyyMM"/></el-descriptions-item>
        <el-descriptions-item label="毕业时间"><el-input v-model="detail.在职毕业" placeholder="yyyyMM"/></el-descriptions-item>
        <el-descriptions-item label="学位"><el-input v-model="detail.在职学位"/></el-descriptions-item>
      </el-descriptions>
    </el-col>
  </el-row>

  <div style="font-weight:bold;font-size:17px;border-bottom:2px solid #409EFF;padding-bottom:4px;margin:24px 0 12px 0;">档案整理及数字化情况</div>
  <el-descriptions :column="3" border>
    <el-descriptions-item label="档案整理人"><el-input v-model="detail.档案整理人"/></el-descriptions-item>
    <el-descriptions-item label="数字档案采集人"><el-input v-model="detail.数字档案采集人"/></el-descriptions-item>
    <el-descriptions-item label="档案卷数"><el-input v-model="detail.档案卷数"/></el-descriptions-item>
    <el-descriptions-item label="报送日期"><el-input v-model="detail.报送日期"/></el-descriptions-item>
    <el-descriptions-item label="整理审核人"><el-input v-model="detail.整理审核人"/></el-descriptions-item>
    <el-descriptions-item label="数字档案审核人"><el-input v-model="detail.数字档案审核人"/></el-descriptions-item>
    <el-descriptions-item label="档案报送单位" :span="3"><el-input v-model="detail.档案报送单位"/></el-descriptions-item>
  </el-descriptions>

  <div style="font-weight:bold;font-size:17px;border-bottom:2px solid #409EFF;padding-bottom:4px;margin:24px 0 12px 0;">干部人事档案专项审核情况</div>
  <el-descriptions :column="1" border label-width="140px">
    <el-descriptions-item label="档案存在问题"><el-input v-model="detail.档案存在问题" type="textarea" :rows="4"/></el-descriptions-item>
    <el-descriptions-item label="材料补齐情况"><el-input v-model="detail.材料补齐情况" type="textarea" :rows="4"/></el-descriptions-item>
    <el-descriptions-item label="认定文件内容登记"><el-input v-model="detail.认定文件内容" type="textarea" :rows="4"/></el-descriptions-item>
  </el-descriptions>

</div>
<div v-else style="text-align:center;color:#909399;margin-top:150px;">请选择人员</div>

<script>
const { createApp, ref, reactive, onMounted } = Vue;
const { ElMessage } = ElementPlus;

const app = createApp({
  setup() {
    const params = new URLSearchParams(window.location.search);
    const rsid = ref(params.get('rsid'));
    const detail = ref({});

    const loadDetail = () => {
      if (!rsid.value) return;
      axios.get('/archives/api/person-detail/', { params: { rsid: rsid.value } }).then(res => {
        if (res.data.code === 0) detail.value = res.data.data;
      });
    };

    const saveBasic = () => {
      axios.post('/archives/api/person-save/', detail.value).then(res => {
        ElMessage[res.data.code === 0 ? 'success' : 'error'](res.data.msg);
      });
    };
    const show_image = () => {
  if (!rsid.value) {
    ElMessage.warning('未获取到人员编号');
    return;
  }
  // 新窗口打开档案扫描查看页面
  window.open(`/archives/image/scan/?rsid=${rsid.value}`, '_blank');
};
    const uploadPhoto = () => {
      document.querySelector('#app input[type=file]').click();
    };

    const handlePhotoChange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 300 * 1024) { ElMessage.error('照片不能超过300KB'); return; }
      const reader = new FileReader();
      reader.onload = (ev) => { detail.value.照片 = ev.target.result; };
      reader.readAsDataURL(file);
    };

    onMounted(loadDetail);

    const zzmmOptions = ["中国共产党党员","中国共产党预备党员","中国共产主义青年团团员","中国国民党革命委员会会员","中国民主同盟盟员","中国民主建国会会员","中国民主促进会会员","中国农工民主党党员","中国致公党党员","九三学社社员","台湾民主自治同盟盟员","无党派民主人士","群众"];
    const ryztOptions = ["在职","离退","转出","死亡","其他"];
    const mzOptions = ["汉族","蒙古族","回族","藏族","维吾尔族","苗族","彝族","壮族","布依族","朝鲜族","满族","侗族","瑶族","白族","土家族","哈尼族","哈萨克族","傣族","黎族","僳僳族","佤族","畲族","高山族","拉祜族","水族","东乡族","纳西族","景颇族","柯尔克孜族","土族","达斡尔族","仫佬族","羌族","布朗族","撒拉族","毛难族","仡佬族","锡伯族","阿昌族","普米族","塔吉克族","怒族","乌孜别克族","俄罗斯族","鄂温克族","崩龙族","保安族","裕固族","京族","塔塔尔族","独龙族","鄂伦春族","赫哲族","门巴族","珞巴族","基诺族","穿青人","其他外国血统"];

    return { rsid, detail, loadDetail, saveBasic, show_image, uploadPhoto, handlePhotoChange, zzmmOptions, ryztOptions, mzOptions };
  }
});

app.config.compilerOptions.delimiters = ['[[', ']]'];
app.use(ElementPlus).mount('#app');
</script>
{% endblock %}
