{% extends "layout/base.html" %}
{% block title %}档案人员维护{% endblock %}

{% block content %}
<style>
.el-tabs { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
.el-tabs__content { flex: 1; overflow: hidden; }
.el-tab-pane { height: 100%; overflow: hidden; }
</style>

<div id="app" style="padding:8px;height:100vh;display:flex;flex-direction:column;">
  <div style="flex:1;display:flex;overflow:hidden;">

    <!-- 左侧面板 -->
    <div id="leftPanel" style="width:280px;border:1px solid #e4e7ed;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;">
  <iframe src="/components/person-panel-embed/" style="width:100%;flex:1;border:none;"></iframe>
  <div style="padding:6px 10px;border-top:1px solid #e4e7ed;flex-shrink:0;background:#fafafa;">
    <span style="font-weight:bold;font-size:28px;">[[ currentPerson.tname || currentPerson.displayName || '请选择人员' ]]</span>
    <span v-if="currentPerson.rsid" style="color:#909399;font-size:12px;margin-left:6px;">RSID:[[ currentPerson.rsid ]]</span>
</div>
</div>

    <!-- 拖动条 -->
    <div id="dragBar" style="width:6px;background:#e4e7ed;cursor:col-resize;flex-shrink:0;margin:0 2px;"></div>

    <!-- 右侧 -->
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;">
      <el-tabs v-model="activeTab" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
        <el-tab-pane label="基本信息" name="basic">
          <iframe v-if="activeTab==='basic' && currentPerson.rsid" :src="'/archives/person-basic/?rsid='+currentPerson.rsid"
                  style="width:100%;height:100%;border:none;display:block;"></iframe>
        </el-tab-pane>
        <el-tab-pane label="工资表9-1-1" name="salary">
          <iframe v-if="activeTab==='salary' && currentPerson.rsid" :src="'/archives/person-salary/?rsid='+currentPerson.rsid"
                  style="width:100%;height:100%;border:none;display:block;"></iframe>
        </el-tab-pane>
        <el-tab-pane label="职务变动9-2-1" name="position">
          <iframe v-if="activeTab==='position' && currentPerson.rsid" :src="'/archives/person-position/?rsid='+currentPerson.rsid"
                  style="width:100%;height:100%;border:none;display:block;"></iframe>
        </el-tab-pane>
        <el-tab-pane label="档案专审情况" name="audit">
          <iframe v-if="activeTab==='audit' && currentPerson.rsid" :src="'/archives/person-audit/?rsid='+currentPerson.rsid"
                  style="width:100%;height:100%;border:none;display:block;"></iframe>
        </el-tab-pane>
        <el-tab-pane label="认定表" name="identify">
          <iframe v-if="activeTab==='identify' && currentPerson.rsid" :src="'/archives/person-identify/?rsid='+currentPerson.rsid"
                  style="width:100%;height:100%;border:none;display:block;"></iframe>
        </el-tab-pane>
        <el-tab-pane label="任前联审" name="preaudit">
          <iframe v-if="activeTab==='preaudit' && currentPerson.rsid" :src="'/archives/person-preaudit/?rsid='+currentPerson.rsid"
                  style="width:100%;height:100%;border:none;display:block;"></iframe>
        </el-tab-pane>
        <el-tab-pane label="干部任免表" name="cadre">
          <iframe v-if="activeTab==='cadre' && currentPerson.rsid" :src="'/archives/person-cadre/?rsid='+currentPerson.rsid"
                  style="width:100%;height:100%;border:none;display:block;"></iframe>
        </el-tab-pane>
        <el-tab-pane label="档案目录" name="directory">
          <iframe v-if="activeTab==='directory' && currentPerson.rsid" :src="'/archives/person-directory/?rsid='+currentPerson.rsid"
                  style="width:100%;height:100%;border:none;display:block;"></iframe>
        </el-tab-pane>
        <el-tab-pane label="补充信息" name="supplement">
          <iframe v-if="activeTab==='supplement' && currentPerson.rsid" :src="'/archives/person-supplement/?rsid='+currentPerson.rsid"
                  style="width:100%;height:100%;border:none;display:block;"></iframe>
        </el-tab-pane>
        <el-tab-pane label="家庭成员" name="family">
          <iframe v-if="activeTab==='family' && currentPerson.rsid" :src="'/archives/person-family/?rsid='+currentPerson.rsid"
                  style="width:100%;height:100%;border:none;display:block;"></iframe>
        </el-tab-pane>
      </el-tabs>
    </div>
  </div>
</div>

<script>
  const { createApp, ref, onMounted } = Vue;

const app = createApp({
  delimiters: ['[[', ']]'],
  setup() {
    const currentPerson = ref({});
    const activeTab = ref('basic');

    window.addEventListener('message', (e) => {
      if (e.data.type === 'person-select') {
        currentPerson.value = e.data.data;
      }
    });

    onMounted(() => {
      const bar = document.getElementById('dragBar');
      const left = document.getElementById('leftPanel');
      let startX, startWidth;
      bar.addEventListener('mousedown', (e) => {
        startX = e.clientX;
        startWidth = left.offsetWidth;
        const iframe = left.querySelector('iframe');
        if (iframe) iframe.style.pointerEvents = 'none';

        const onMove = (ev) => {
          let w = startWidth + ev.clientX - startX;
          if (w < 200) w = 200;
          if (w > 500) w = 500;
          left.style.width = w + 'px';
          left.style.minWidth = w + 'px';
          left.style.flexShrink = '0';
        };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          if (iframe) iframe.style.pointerEvents = '';
        };
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        e.preventDefault();
      });
    });

    return { currentPerson, activeTab };
  }
});

app.use(ElementPlus).mount('#app');
</script>
{% endblock %}
