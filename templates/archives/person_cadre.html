{% extends "layout/base.html" %}
{% block title %}干部任免表{% endblock %}
{% block content %}
<style>
html, body { height:100%; margin:0; padding:0; overflow:hidden; }
#app { height:100%; display:flex; }
.cadre-left { width:320px; border-right:1px solid #ddd; display:flex; flex-direction:column; overflow:hidden; }
.cadre-right { flex:1; overflow-y:auto; padding:10px; }
.cadre-table { border-collapse:collapse; width:100%; font-size:13px; cursor:pointer; }
.cadre-table th, .cadre-table td { padding:6px 8px; border:1px solid #ddd; }
.cadre-table th { background:#f5f5f5; position:sticky; top:0; }
.cadre-table tr:hover { background:#e8f0fe; }
.cadre-table tr.active { background:#d0e4fc; }
.form-row { display:flex; align-items:center; margin:4px 0; }
.form-row label { width:120px; text-align:right; padding-right:8px; font-size:13px; color:#606266; flex-shrink:0; }
.form-row input, .form-row textarea, .form-row select { flex:1; border:1px solid #ddd; padding:4px 6px; font-size:13px; border-radius:3px; }
.form-row textarea { min-height:60px; resize:vertical; }
.fam-row { display:flex; gap:6px; margin:3px 0; }
.fam-row input { width:80px; }
.fam-row input.wide { width:150px; }
</style>

<div id="app" v-if="rsid">
  <div class="cadre-left">
    <div style="padding:6px 10px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;gap:6px;">
      <el-button size="small" @click="addCadre">新增</el-button>
      <el-button size="small" type="danger" @click="deleteCadre">删除</el-button>
      <el-button size="small" @click="extractCadre">提取数据</el-button>
    </div>
    <div style="flex:1;overflow:auto;">
      <table class="cadre-table">
        <thead><tr><th>ID</th><th>名称</th><th>姓名</th><th>现任职务</th></tr></thead>
        <tbody>
          <tr v-for="(r,i) in cadreList" :key="r.ID" :class="{ active: currentID === r.ID }" @click="selectCadre(r)">
            <td>[[ r.ID ]]</td>
            <td>[[ r.名称 ]]</td>
            <td>[[ r.姓名 ]]</td>
            <td>[[ r.现任职务 ]]</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="cadre-right" v-if="currentID">
    <div style="display:flex;gap:6px;margin-bottom:8px;">
      <el-button type="primary" size="small" @click="saveCadre">保存</el-button>
      <el-button size="small" @click="getImage">获取照片</el-button>
      <el-button size="small" @click="calcAge">计算年龄</el-button>
      <el-button size="small" @click="printCadre">打印（专审专用）</el-button>
      <el-button size="small" @click="printCadreNormal">打印（普通）</el-button>
    <div class="form-row"><label>表名称</label><input v-model="form.BMMC"></div>
    </div>
<div style="float:right;width:120px;height:150px;border:1px solid #ddd;margin-left:10px;text-align:center;">
  <img v-if="form.DQZP" :src="'data:image/jpeg;base64,' + form.DQZP" style="width:100%;height:100%;object-fit:cover;">
  <span v-else style="color:#ccc;line-height:150px;">无照片</span>
</div>
    <div style="font-weight:bold;margin:10px 0 6px 0;">基本信息</div>

    <div class="form-row"><label>姓名</label><input v-model="form.XM"><label style="width:60px;">性别</label><input v-model="form.XB" style="width:80px;"><label style="width:60px;">民族</label><input v-model="form.MZ" style="width:100px;"></div>
    <div class="form-row"><label>出生年月</label><input v-model="form.CSNY"><label style="width:60px;">年龄</label><input v-model="form.NL" style="width:80px;"></div>
    <div class="form-row"><label>籍贯</label><input v-model="form.JG"><label style="width:60px;">出生地</label><input v-model="form.CHUSHENGDI"></div>
    <div class="form-row"><label>参工时间</label><input v-model="form.WORKTIME"><label style="width:60px;">政治面貌</label><input v-model="form.ZZMM"></div>
    <div class="form-row"><label>健康状况</label><input v-model="form.HEALTH" style="width:120px;"><label style="width:60px;">计算年龄</label>
      <select v-model="form.JRSJ" style="width:100px;">
        <option v-for="y in years" :key="y" :value="y">[[ y ]]</option>
      </select>
    </div>

    <div style="font-weight:bold;margin:12px 0 6px 0;">职务信息</div>
    <div class="form-row"><label>现任职务</label><textarea v-model="form.XIANRENZHIWU" style="min-height:40px;"></textarea></div>
    <div class="form-row"><label>拟任职务</label><input v-model="form.NIRENZHIWU"></div>
    <div class="form-row"><label>拟免职务</label><input v-model="form.NIMIANZHIWU"></div>
    <div class="form-row"><label>专业技术职务</label><input v-model="form.ZHUANYEJISHUZHIWU"></div>
    <div class="form-row"><label>熟悉专业特长</label><input v-model="form.ZHUANCHANG"></div>

    <div style="font-weight:bold;margin:12px 0 6px 0;">学历信息</div>
    <div class="form-row"><label>全日制教育</label><input v-model="form.QUANRIZIJIAOYU" placeholder="学历+学位"><input v-model="form.QUANRIZIYXZY" placeholder="学校+专业" style="margin-left:4px;"></div>
    <div class="form-row"><label>在职教育</label><input v-model="form.ZAIZHIJIAOYU" placeholder="学历+学位"><input v-model="form.ZAIZHIYXZY" placeholder="学校+专业" style="margin-left:4px;"></div>

    <div style="font-weight:bold;margin:12px 0 6px 0;">简历</div>
    <div class="form-row"><label>简历</label><textarea v-model="form.JL" style="min-height:100px;"></textarea></div>

    <div style="font-weight:bold;margin:12px 0 6px 0;">奖惩及考核</div>
    <div class="form-row"><label>奖惩情况</label><textarea v-model="form.JIANGCHENGQINGKUANG" style="min-height:60px;"></textarea></div>
    <div class="form-row"><label>年度考核</label><textarea v-model="form.YEARCHECK" style="min-height:60px;"></textarea></div>

    <div style="font-weight:bold;margin:12px 0 6px 0;">任免意见</div>
    <div class="form-row"><label>任免理由</label><input v-model="form.RENMIANREASON"></div>
    <div class="form-row"><label>呈报单位</label><input v-model="form.CHENGBAODANWEI"></div>
    <div class="form-row"><label>审批机关意见</label><textarea v-model="form.SHENPIJIGUANYIJIAN" style="min-height:60px;"></textarea></div>
    <div class="form-row"><label>行政机关意见</label><textarea v-model="form.XZJGYJ" style="min-height:60px;"></textarea></div>

    <div style="font-weight:bold;margin:12px 0 6px 0;">家庭成员</div>
    <div v-for="n in 7" :key="n" class="fam-row">
      <input v-model="form['CHENGWEI'+n]" placeholder="称谓" style="width:60px;">
      <input v-model="form['XINGMING'+n]" placeholder="姓名" class="wide">
      <input v-model="form['NIANLING'+n]" placeholder="年龄" style="width:50px;">
      <input v-model="form['ZHENGZHIMIANMAO'+n]" placeholder="政治面貌">
      <input v-model="form['UNITANDZHIWU'+n]" placeholder="工作单位" class="wide">
      <input v-model="form['csny'+n]" placeholder="出生年月" style="width:80px;">
    </div>

    <div style="height:40px;"></div>
  </div>
</div>
<div v-else style="text-align:center;color:#909399;margin-top:150px;">请选择人员</div>

<script>
(function(){
  const { createApp, ref, reactive, onMounted } = Vue;
  const { ElMessage, ElMessageBox } = ElementPlus;
  const app = createApp({
    setup() {
      const p = new URLSearchParams(window.location.search);
      const rsid = ref(p.get('rsid'));
      const cadreList = ref([]);
      const currentID = ref(null);
      const form = reactive({});

      const years = Array.from({length: 50}, (_, i) => String(new Date().getFullYear() - i));

      const loadList = () => {
        axios.get('/archives/api/cadre-list/', { params: { rsid: rsid.value } }).then(res => {
          if (res.data.code === 0) cadreList.value = res.data.data || [];
          else ElMessage.error(res.data.msg);
        }).catch(() => ElMessage.error('加载列表失败'));
      };

      const selectCadre = (row) => {
        currentID.value = row.ID;
        axios.get('/archives/api/cadre-detail/', { params: { rsid: rsid.value, id: row.ID } }).then(res => {
          if (res.data.code === 0) {
            Object.keys(form).forEach(k => delete form[k]);
            Object.assign(form, res.data.data || {});
          } else ElMessage.error(res.data.msg);
        }).catch(() => ElMessage.error('加载详情失败'));
      };

      const addCadre = () => {
        if (!rsid.value) { ElMessage.warning('未选择人员'); return; }
        axios.get('/archives/api/cadre-add/', { params: { rsid: rsid.value } }).then(res => {
          if (res.data.code === 0) cadreList.value = res.data.data || [];
          else ElMessage.error(res.data.msg);
        }).catch(() => ElMessage.error('新增失败'));
      };

      const deleteCadre = () => {
        if (!currentID.value) { ElMessage.warning('请先选中一条'); return; }
        ElMessageBox.confirm('确定删除？','确认',{type:'warning'}).then(() => {
          axios.get('/archives/api/cadre-delete/', { params: { rsid: rsid.value, id: currentID.value } }).then(res => {
            if (res.data.code === 0) { cadreList.value = res.data.data || []; currentID.value = null; Object.keys(form).forEach(k => delete form[k]); }
            else ElMessage.error(res.data.msg);
          }).catch(() => ElMessage.error('删除失败'));
        });
      };

      const extractCadre = () => {
        if (!currentID.value) { ElMessage.warning('请先选中一条'); return; }
        axios.get('/archives/api/cadre-extract/', { params: { rsid: rsid.value, id: currentID.value } }).then(res => {
          if (res.data.code === 0) { Object.keys(form).forEach(k => delete form[k]); Object.assign(form, res.data.data || {}); }
          else ElMessage.error(res.data.msg);
        }).catch(() => ElMessage.error('提取失败'));
      };

      const saveCadre = () => {
        axios.post('/archives/api/cadre-save/', { rsid: rsid.value, id: currentID.value, ...form }).then(res => {
          if (res.data.code === 0) ElMessage.success(res.data.msg);
          else ElMessage.error(res.data.msg);
        }).catch(() => ElMessage.error('保存失败'));
      };

      const calcAge = () => {
        let year = parseInt(form.JRSJ) || new Date().getFullYear();
        for (let n = 1; n <= 7; n++) {
          let csny = form['csny'+n];
          if (csny && csny.length >= 4) form['NIANLING'+n] = String(year - parseInt(csny.substring(0,4)));
        }
        if (form.CSNY && form.CSNY.length >= 4) form.NL = '(' + (year - parseInt(form.CSNY.substring(0,4))) + '岁)';
        ElMessage.success('年龄计算完成');
      };

      const getImage = () => { ElMessage.info('照片功能待完善'); };
      const printCadre = () => { ElMessage.info('打印功能待完善'); };
      const printCadreNormal = () => { ElMessage.info('打印功能待完善'); };

      onMounted(loadList);
      return { rsid, cadreList, currentID, form, years, loadList, selectCadre, addCadre, deleteCadre, extractCadre, saveCadre, calcAge, getImage, printCadre, printCadreNormal };
    }
  });
  app.config.compilerOptions.delimiters = ['[[', ']]'];
  app.use(ElementPlus).mount('#app');
})();
</script>
{% endblock %}
