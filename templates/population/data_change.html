{% extends "layout/base.html" %}
{% block content %}

<div id="app" style="padding:10px;">

  <!-- 查询折叠面板 -->
  <el-collapse>
    <el-collapse-item title="查询条件" name="1">
      <el-card>
        <el-form :inline="true" :model="queryForm" label-width="80px">
          <el-form-item label="人员姓名">
            <el-input v-model="queryForm.name" style="width:200px"></el-input>
          </el-form-item>
          <el-form-item label="身份证号">
            <el-input v-model="queryForm.idCard" style="width:220px"></el-input>
          </el-form-item>
          <el-form-item label="家庭住址">
            <el-input v-model="queryForm.address" style="width:280px"></el-input>
          </el-form-item>
          <el-form-item>
            <el-button type="primary" @click="doQuery">查询</el-button>
            <el-button @click="resetQuery">重置</el-button>
          </el-form-item>
        </el-form>
      </el-card>
    </el-collapse-item>
  </el-collapse>

  <!-- 左右布局 + 可拖动 -->
  <div style="margin-top:10px; display:flex; position:relative;">
    <!-- 左侧：列表 -->
    <div ref="leftPanel" style="width:50%; padding-right:5px;">
      <el-card>
        <el-table :data="list" border @row-click="selectPerson">
          <el-table-column label="姓名" prop="Name"></el-table-column>
          <el-table-column label="身份证" prop="IDCard"></el-table-column>
          <el-table-column label="性别" prop="Gender"></el-table-column>
        </el-table>

        <!-- 分页（中文） -->
        <el-pagination
          style="margin-top:10px; text-align:center"
          v-model:current-page="page"
          v-model:page-size="pageSize"
          :total="total"
          layout="total, prev, pager, next, jumper"
          @current-change="doQuery"
        ></el-pagination>
      </el-card>
    </div>

    <!-- 拖动条 -->
    <div id="dragBar" style="width:6px; background:#e5e7eb; cursor:col-resize; height:100%;"></div>

    <!-- 右侧：编辑 -->
    <div ref="rightPanel" style="flex:1; padding-left:5px;">
      <el-card>
        <div style="padding:10px;">
          <div><b>当前姓名：</b> {{ form.Name }}</div>
          <div><b>当前身份证：</b> {{ form.IDCard }}</div>
        </div>
        <el-divider>关键数据修改</el-divider>
        <el-form label-width="120px" style="padding:10px;">
          <el-form-item label="新姓名">
            <el-input v-model="form.Name"></el-input>
          </el-form-item>
          <el-form-item label="新身份证号">
            <el-input v-model="form.IDCard"></el-input>
          </el-form-item>
          <el-form-item>
            <el-button type="primary" @click="saveKeyData">保存关键数据</el-button>
          </el-form-item>
        </el-form>
      </el-card>
    </div>
  </div>

</div>

<script>
const { createApp, ref, onMounted } = Vue;
const ElMessage = ElementPlus.ElMessage;

createApp({
  setup() {
    const queryForm = ref({ name: '', idCard: '', address: '' });
    const page = ref(1);
    const pageSize = ref(30);
    const total = ref(0);
    const list = ref([]);
    const form = ref({ RSID: '', Name: '', IDCard: '' });
    const leftPanel = ref(null);

    // 查询
    const doQuery = () => {
      axios.get('/population/api/person-query/', {
        params: { ...queryForm.value, page: page.value, pageSize: pageSize.value }
      }).then(res => {
        if (res.data.code === 0) {
          list.value = res.data.data;
          total.value = res.data.total;
        }
      });
    };

    // 重置
    const resetQuery = () => {
      queryForm.value = { name: '', idCard: '', address: '' };
      doQuery();
    };

    // 选择
    const selectPerson = (row) => {
      form.value = { ...row };
    };

    // 保存
    const saveKeyData = () => {
      if (!form.value.RSID) return ElMessage.warning("请先选择人员");
      axios.post('/population/api/key-data-update/', {
        RSID: form.value.RSID,
        Name: form.value.Name,
        IDCard: form.value.IDCard
      }).then(res => {
        if (res.data.code === 0) {
          ElMessage.success("保存成功");
          doQuery();
        } else {
          ElMessage.error(res.data.msg);
        }
      });
    };

    // 左右拖动
    onMounted(() => {
      const bar = document.getElementById('dragBar');
      const left = leftPanel.value;

      bar.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const parentWidth = left.parentElement.offsetWidth;

        const move = (ev) => {
          let per = (ev.clientX / parentWidth) * 100;
          if (per < 20) per = 20;
          if (per > 80) per = 80;
          left.style.width = per + '%';
        };

        const up = () => {
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mouseup', up);
        };

        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', up);
      });
    });

    doQuery();

    return {
      queryForm, page, pageSize, total, list, form, leftPanel,
      doQuery, resetQuery, selectPerson, saveKeyData
    };
  }
})
.use(ElementPlus, { locale: ElementPlusLocaleZhCn })
.mount('#app');
</script>

{% endblock %}
