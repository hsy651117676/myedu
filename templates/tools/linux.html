{% extends "layout/base.html" %}
{% block title %}Linux 命令速查{% endblock %}
{% block content %}
<style>
html, body { height:100%; margin:0; padding:0; overflow:hidden; }
#app { height:100%; display:flex; flex-direction:column; }
.toolbar { display:flex; align-items:center; gap:8px; padding:6px 12px; background:#fff; border-bottom:1px solid #e0e0e0; flex-shrink:0; flex-wrap:wrap; }
.toolbar input, .toolbar select { height:30px; border:1px solid #dcdfe6; border-radius:4px; padding:0 8px; font-size:13px; }
.toolbar input { width:200px; }
.main-row { flex:1; display:flex; overflow:hidden; }
.cat-panel { width:160px; min-width:100px; border-right:1px solid #e0e0e0; overflow-y:auto; padding:8px; flex-shrink:0; }
.cat-item { padding:5px 8px; cursor:pointer; font-size:13px; border-radius:4px; margin-bottom:2px; display:flex; justify-content:space-between; }
.cat-item:hover { background:#e8f0fe; }
.cat-item.active { background:#d0e4fc; font-weight:bold; color:#409EFF; }
.cat-item .count { color:#909399; font-size:11px; }
.list-panel { width:320px; min-width:200px; border-right:1px solid #e0e0e0; display:flex; flex-direction:column; overflow:hidden; }
.list-scroll { flex:1; overflow-y:auto; }
.list-item { padding:8px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid #f0f0f0; display:flex; align-items:center; gap:8px; }
.list-item:hover { background:#e8f0fe; }
.list-item.active { background:#d0e4fc; }
.list-item .cmd-name { font-weight:bold; color:#303133; white-space:nowrap; }
.list-item .cmd-desc { color:#909399; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.list-item .cmd-icons { margin-left:auto; display:flex; gap:4px; flex-shrink:0; }
.list-item .cmd-icons button { padding:2px 6px; font-size:11px; }
.list-pagination { padding:6px; border-top:1px solid #e0e0e0; display:flex; justify-content:center; flex-shrink:0; }
.detail-panel { flex:1; min-width:300px; overflow-y:auto; padding:16px; }
.detail-panel .empty { text-align:center; color:#ccc; margin-top:80px; font-size:14px; }
.detail-panel h3 { margin-bottom:12px; color:#409EFF; }
.detail-panel .meta { color:#909399; font-size:12px; margin-bottom:12px; }
.detail-panel .markdown-body { font-size:14px; line-height:1.8; }
.detail-panel textarea { width:100%; min-height:400px; border:1px solid #ddd; border-radius:4px; padding:10px; font-size:13px; font-family:monospace; resize:vertical; }
.drag-bar { width:4px; background:#e4e7ed; cursor:col-resize; flex-shrink:0; }
.drag-bar:hover { background:#c0c4cc; }
pre { background:#f5f5f5; padding:12px; border-radius:4px; overflow-x:auto; font-size:13px; }
code { background:#f0f0f0; padding:2px 6px; border-radius:3px; font-size:13px; }
pre code { background:transparent; padding:0; }
</style>

<div id="app">
  <div class="toolbar">
    <span style="font-weight:bold;font-size:15px;color:#409EFF;">🐧 Linux 命令速查</span>
    <input v-model="keyword" placeholder="搜索命令或描述..." @keyup.enter="search">
    <select v-model="selectedCategory" @change="search">
      <option value="">全部分类</option>
      <option v-for="c in categories" :key="c.category" :value="c.category">[[ c.category ]] ([[ c.count ]])</option>
    </select>
    <el-button size="small" @click="search">搜索</el-button>
    <el-button v-if="isAdmin" size="small" type="success" @click="addNew">+ 新增</el-button>
    <el-switch v-if="isAdmin" v-model="editMode" active-text="管理" inactive-text="查看" size="small" style="margin-left:8px;" />
  </div>

  <div class="main-row">
    <div class="cat-panel" id="catPanel">
      <div class="cat-item" :class="{active: selectedCategory===''}" @click="selectedCategory=''; search()">
        <span>全部</span><span class="count">[[ totalCount ]]</span>
      </div>
      <div v-for="c in categories" :key="c.category" class="cat-item"
           :class="{active: selectedCategory===c.category}"
           @click="selectedCategory=c.category; search()">
        <span>[[ c.category ]]</span><span class="count">[[ c.count ]]</span>
      </div>
    </div>
    <div class="drag-bar" data-target="catPanel"></div>

    <div class="list-panel" id="listPanel">
      <div class="list-scroll">
        <div v-for="item in list" :key="item.id" class="list-item"
             :class="{active: currentItem && currentItem.id===item.id}"
             @click="selectItem(item)">
          <span class="cmd-name">[[ item.name ]]</span>
          <span class="cmd-desc">[[ item.description || '' ]]</span>
          <span class="cmd-icons" v-if="editMode" @click.stop>
            <button @click="editItem(item)">✏️</button>
            <button @click="deleteItem(item)">🗑</button>
          </span>
        </div>
        <div v-if="list.length===0" style="text-align:center;color:#ccc;padding:30px;">暂无数据</div>
      </div>
      <div class="list-pagination" v-if="total>0">
        <el-pagination small background layout="prev, pager, next"
          :page-size="pageSize" :total="total" :current-page="currentPage"
          @current-change="onPageChange" />
      </div>
    </div>
    <div class="drag-bar" data-target="listPanel"></div>

    <div class="detail-panel" id="detailPanel">
      <template v-if="currentItem">
        <template v-if="editMode && editingItem">
          <h3><input v-model="editingItem.name" style="font-size:16px;font-weight:bold;width:200px;"></h3>
          <div class="meta">
            分类：<input v-model="editingItem.category" style="width:100px;">
          </div>
          <div class="meta">
            描述：<input v-model="editingItem.description" style="width:100%;">
          </div>
          <textarea v-model="editingItem.markdown" placeholder="Markdown 内容"></textarea>
          <div style="margin-top:8px;display:flex;gap:8px;">
            <el-button type="primary" size="small" @click="saveEdit">保存</el-button>
            <el-button size="small" @click="cancelEdit">取消</el-button>
          </div>
        </template>
        <template v-else>
          <h3>[[ currentItem.name ]]</h3>
          <div class="meta">分类：[[ currentItem.category ]] | [[ currentItem.description || '暂无描述' ]]</div>
          <div class="markdown-body" v-html="renderedMarkdown"></div>
        </template>
      </template>
      <div v-else class="empty">👈 点击左侧命令查看详情</div>
    </div>
  </div>
</div>

<script>
(function(){
  const { createApp, ref, reactive, computed, onMounted, nextTick, watch } = Vue;
  const { ElMessage, ElMessageBox } = ElementPlus;

  const app = createApp({
    delimiters: ['[[', ']]'],
    setup(){
      const keyword = ref('');
      const selectedCategory = ref('');
      const categories = ref([]);
      const list = ref([]);
      const total = ref(0);
      const currentPage = ref(1);
      const pageSize = ref(30);
      const currentItem = ref(null);
      const editMode = ref(false);
      const editingItem = ref(null);
      const isAdmin = ref(false);
      const totalCount = ref(0);
const renderedMarkdown = computed(() => {
  if (!currentItem.value || !currentItem.value.markdown) return '';
  try {
    const html = marked.parse(currentItem.value.markdown);
    nextTick(() => {
      document.querySelectorAll('.detail-panel pre code').forEach(block => {
        hljs.highlightElement(block);
      });
    });
    return html;
  } catch(e) { return currentItem.value.markdown; }
});

      const loadCategories = async () => {
        const r = await axios.get('/tools/api/linux/categories/');
        if (r.data.code===0) {
          categories.value = r.data.data||[];
          totalCount.value = categories.value.reduce((s,c) => s + c.count, 0);
        }
      };

      const search = async () => {
        const r = await axios.get('/tools/api/linux/list/', {
          params: { keyword: keyword.value, category: selectedCategory.value, page: currentPage.value, pageSize: pageSize.value }
        });
        if (r.data.code===0) { list.value = r.data.data||[]; total.value = r.data.total||0; }
      };

      const selectItem = (item) => {
        currentItem.value = item;
        editingItem.value = null;
      };

      const onPageChange = (p) => { currentPage.value = p; search(); };

      const addNew = () => {
        editingItem.value = { id: null, name: '', category: '', description: '', markdown: '' };
        currentItem.value = editingItem.value;
      };

      const editItem = (item) => {
        editingItem.value = { ...item };
        currentItem.value = editingItem.value;
      };

      const saveEdit = async () => {
        const r = await axios.post('/tools/api/linux/save/', editingItem.value);
        if (r.data.code===0) {
          ElMessage.success('保存成功');
          editingItem.value = null;
          search();
          loadCategories();
        } else {
          ElMessage.error(r.data.msg);
        }
      };

      const cancelEdit = () => {
        editingItem.value = null;
        if (currentItem.value && !currentItem.value.id) currentItem.value = null;
      };

      const deleteItem = (item) => {
        ElMessageBox.confirm(`确定删除 "${item.name}"？`, '确认', { type: 'warning' }).then(async () => {
          const r = await axios.post('/tools/api/linux/delete/', { id: item.id });
          if (r.data.code===0) {
            ElMessage.success('已删除');
            if (currentItem.value && currentItem.value.id === item.id) currentItem.value = null;
            search();
            loadCategories();
          }
        }).catch(()=>{});
      };

      const initDrag = () => {
        document.querySelectorAll('.drag-bar').forEach(bar => {
          bar.addEventListener('mousedown', (e) => {
            const panel = document.getElementById(bar.dataset.target);
            if (!panel) return;
            const startX = e.clientX, startW = panel.offsetWidth;
            const onMove = (ev) => {
              let w = startW + ev.clientX - startX;
              if (w < 80) w = 80; if (w > 800) w = 800;
              panel.style.width = w + 'px'; panel.style.minWidth = w + 'px'; panel.style.flexShrink = '0'; panel.style.flexGrow = '0';
            };
            const onUp = () => {
              document.removeEventListener('mousemove', onMove);
              document.removeEventListener('mouseup', onUp);
              document.body.style.cursor = ''; document.body.style.userSelect = '';
            };
            document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
            e.preventDefault();
          });
        });
      };

      onMounted(async () => {
        isAdmin.value = document.cookie.includes('is_admin=1') || false;
        // 也可通过 django 模板传： {% if user.is_superuser %}isAdmin.value = true;{% endif %}
        await loadCategories();
        search();
        initDrag();
      });

      return { keyword, selectedCategory, categories, list, total, currentPage, pageSize,
               currentItem, editMode, editingItem, isAdmin, totalCount, renderedMarkdown,
               search, selectItem, onPageChange, addNew, editItem, saveEdit, cancelEdit, deleteItem };
    }
  });

  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn }).mount('#app');
})();
</script>
<!-- markdown 渲染 -->
<link rel="stylesheet" href="/static/lib/github.min.css">
<script src="/static/lib/highlight.min.js"></script>
<script src="/static/lib/marked.min.js"></script>
{% endblock %}
