<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>歌词编辑</title>
  <link rel="stylesheet" href="/static/lib/element-plus.css">
  <script src="/static/lib/vue.global.prod.js"></script>
  <script src="/static/lib/element-plus.min.js"></script>
  <script src="/static/lib/axios.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-size:13px; padding:10px; background:#1a1a2e; color:#fff; }
    textarea { width:100%; height:400px; background:#111; color:#ccc; border:1px solid #333; border-radius:4px; padding:10px; font-size:13px; font-family:monospace; resize:vertical; }
    .info { margin-bottom:8px; color:#aaa; }
  </style>
</head>
<body>
<div id="app">
  <div v-if="loading" style="text-align:center;padding:40px;">加载中...</div>
  <template v-else>
    <div class="info">[[ title ]] - [[ artist ]]</div>
    <textarea v-model="lyric"></textarea>
    <div style="text-align:right;margin-top:8px;">
      <el-button @click="saveLyric" type="primary" :loading="saving">保存</el-button>
    </div>
  </template>
</div>
<script>
(function(){
  const { createApp, ref, onMounted } = Vue;
  const { ElMessage } = ElementPlus;
  const app = createApp({
    delimiters: ['[[', ']]'],
    setup(){
      const params = new URLSearchParams(window.location.search);
      const fileId = ref(params.get('id')||'');
      const title = ref('');
      const artist = ref('');
      const lyric = ref('');
      const loading = ref(true);
      const saving = ref(false);

      const loadLyric = async () => {
        const r = await axios.get('/tools/api/media/lyric/', { params: { id: fileId.value, category: 'music' } });
        if (r.data.code===0 && r.data.type==='lrc') {
          // 还原成原始格式
          lyric.value = r.data.data.map(l => {
            const m = Math.floor(l.time/60), s = (l.time%60).toFixed(2);
            return `[${String(m).padStart(2,'0')}:${String(s).padStart(5,'0')}]${l.text}`;
          }).join('\n');
        }
        const r2 = await axios.get('/tools/api/media/list/', { params: { category:'music', pageSize:1 } });
        // 用单独API获取标题
        loading.value = false;
      };
      // 简化：直接从 list API 获取
      const loadInfo = async () => {
        const r = await axios.get('/tools/api/media/list/', { params: { category:'music', pageSize:500 } });
        if (r.data.code===0) {
          const item = (r.data.data||[]).find(d=>d.ID===parseInt(fileId.value));
          if (item) { title.value = item.Title; artist.value = item.Artist; }
        }
        loading.value = false;
      };

      onMounted(async () => {
        await loadLyric();
        await loadInfo();
      });

      const saveLyric = async () => {
        saving.value = true;
        const r = await axios.post('/tools/api/media/save-lyric/', { id: fileId.value, lyric: lyric.value });
        ElMessage[r.data.code===0?'success':'error'](r.data.msg);
        saving.value = false;
      };

      return { title, artist, lyric, loading, saving, saveLyric };
    }
  });
  app.use(ElementPlus).mount('#app');
})();
</script>
</body>
</html>
