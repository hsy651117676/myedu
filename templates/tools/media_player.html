<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>媒体播放器</title>
  <link rel="stylesheet" href="/static/lib/element-plus.css">
  <script src="/static/lib/vue.global.prod.js"></script>
  <script src="/static/lib/element-plus.min.js"></script>
  <script src="/static/lib/element-plus-zh-cn.min.js"></script>
  <script src="/static/lib/axios.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-size:13px; height:100vh; display:flex; flex-direction:column; overflow:hidden; background:#1a1a2e; color:#fff; }
    .header { display:flex;align-items:center;padding:8px 12px;background:#16213e;gap:10px;flex-shrink:0;flex-wrap:wrap; }
    .header .title { font-size:16px;font-weight:bold; }
    .header input { height:28px;border:none;border-radius:14px;padding:0 12px;font-size:12px;width:160px;color:#333; }
    .header select { height:28px;border:none;border-radius:4px;padding:0 8px;font-size:12px;color:#333; }
    .body { flex:1;display:flex;overflow:hidden; }
    .letter-bar { width:46px;overflow-y:auto;background:#16213e;border-right:1px solid #333;padding:2px 0;flex-shrink:0; }
    .letter-bar .let { padding:5px 0;text-align:center;cursor:pointer;font-size:11px;color:#aaa; }
    .letter-bar .let:hover { color:#409EFF; }
    .letter-bar .let.active { background:#409EFF;color:#fff; }
    .main-list { flex:1;overflow:auto;background:#1a1a2e; }
    table { border-collapse:collapse;width:100%; }
    th,td { padding:7px 10px;text-align:left;border-bottom:1px solid #2a2a4a;font-size:13px;color:#ccc; }
    th { background:#16213e;position:sticky;top:0;z-index:1;color:#aaa; }
    tr:hover { background:#2a2a4a;cursor:pointer; }
    tr.playing { background:#1a3a5c; }
    .player-bar { display:flex;align-items:center;padding:8px 14px;background:#16213e;gap:10px;flex-shrink:0; }
    .player-bar button { background:none;border:none;color:#fff;cursor:pointer;font-size:18px;padding:4px 6px; }
    .player-bar button:hover { color:#409EFF; }
    .player-bar .progress { flex:1;height:4px;background:#333;border-radius:2px;cursor:pointer; }
    .player-bar .progress .bar { height:100%;background:#409EFF;border-radius:2px; }
    .player-bar .time { font-size:11px;color:#aaa;min-width:70px;text-align:center; }
    .player-bar .info { min-width:180px;font-size:12px; }
    .player-bar .cover { width:48px;height:48px;border-radius:4px;object-fit:cover;background:#333; }
    .player-bar .cover-placeholder { width:48px;height:48px;border-radius:4px;background:#333;display:flex;align-items:center;justify-content:center;font-size:20px; }
    .player-panel { flex-shrink:0;display:flex;justify-content:center;background:#000; }
    .player-panel video { max-height:300px;max-width:100%; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <span class="title">🎬 媒体播放器</span>
    <select v-model="category" @change="switchCategory" style="height:28px;border:none;border-radius:4px;padding:0 8px;font-size:12px;color:#333;">
      <option value="music">音乐</option>
      <option value="movie">电影</option>
      <option value="tv">电视剧</option>
    </select>
    <input v-model="keyword" placeholder="搜索" @keyup.enter="search">
    <select v-if="category==='music'" v-model="filterInstrument" @change="search">
      <option value="">全部乐器</option>
      <option v-for="ins in instruments" :key="ins" :value="ins">[[ ins ]]</option>
    </select>
    <select v-if="category==='music'" v-model="filterStyle" @change="search">
      <option value="">全部风格</option>
      <option v-for="st in styles" :key="st" :value="st">[[ st ]]</option>
    </select>
    <button @click="search" style="background:#409EFF;border:none;color:#fff;padding:5px 14px;border-radius:14px;cursor:pointer;">搜索</button>
    <button @click="showUpload=true" style="background:#67c23a;border:none;color:#fff;padding:5px 14px;border-radius:14px;cursor:pointer;">上传</button>
    <a href="/tools/media/manage/" style="color:#409EFF;font-size:12px;margin-left:auto;">管理</a>
  </div>
  <div class="body">
    <div class="letter-bar">
      <div class="let" :class="{active: selectedLetter===''}" @click="selectLetter('')">全</div>
      <div class="let" v-for="l in letters" :key="l" :class="{active: selectedLetter===l}" @click="selectLetter(l)">[[ l ]]</div>
    </div>
    <div class="main-list">
      <table>
        <thead><tr><th style="width:36px;">#</th><th>标题</th><th v-if="category==='music'">歌手</th><th v-else>导演</th><th v-if="category==='tv'">集数</th><th style="width:70px;">时长</th><th style="width:60px;">播放</th></tr></thead>
        <tbody>
          <tr v-for="(r,i) in list" :key="r.ID" :class="{playing: currentId===r.ID}" @dblclick="play(r)">
            <td @click="play(r)" style="color:#409EFF;cursor:pointer;">▶</td>
            <td @click="play(r)">[[ r.Title ]]</td>
            <td v-if="category==='music'">[[ r.Artist ]]</td>
            <td v-else>[[ r.Director || '-' ]]</td>
            <td v-if="category==='tv'">[[ r.Season ? 'S'+r.Season : '' ]][[ r.Episode ? 'E'+r.Episode : '' ]]</td>
            <td>[[ formatDuration(r.Duration) ]]</td>
            <td>[[ r.PlayCount ]]</td>
          </tr>
        </tbody>
      </table>
      <div v-if="total>0" style="display:flex;justify-content:center;padding:10px;flex-shrink:0;">
        <el-pagination small background layout="total, sizes, prev, pager, next"
          :page-sizes="[20,50,100,200]" :page-size="pageSize" :total="total"
          :current-page="currentPage" @size-change="onSizeChange" @current-change="onPageChange" />
      </div>
    </div>
  </div>
  <div class="player-panel" v-show="currentId && (isVideo || playing)">
    <video v-if="isVideo" ref="videoPlayer" controls autoplay @timeupdate="onTimeUpdate" @loadedmetadata="onLoaded" @ended="onEnded" style="max-width:100%;max-height:300px;"></video>
    <audio v-else ref="audioPlayer" @timeupdate="onTimeUpdate" @loadedmetadata="onLoaded" @ended="onEnded"></audio>
  </div>
  <div class="player-bar">
    <img v-if="coverUrl" :src="coverUrl" class="cover">
    <div v-else class="cover-placeholder">🎵</div>
    <button @click="prev">⏮</button>
    <button @click="togglePlay">[[ playing ? '⏸' : '▶️' ]]</button>
    <button @click="next">⏭</button>
    <span class="info">[[ currentTitle || '未播放' ]]</span>
    <span class="time">[[ currentTime ]] / [[ totalTime ]]</span>
    <div class="progress" @click="seek"><div class="bar" :style="{width: progressPercent+'%'}"></div></div>
    <button @click="toggleLoop">[[ loopMode==='顺序'?'🔀': loopMode==='单曲'?'🔂':'🔁' ]]</button>
    <button @click="toggleMute">[[ muted ? '🔇' : '🔊' ]]</button>
    <input type="range" v-model="volume" @input="setVolume" min="0" max="100" style="width:80px;">
  </div>

  <el-dialog v-model="showUpload" title="上传媒体" width="500px" @closed="resetUpload">
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="width:60px;">分类：</span>
        <select v-model="uploadForm.category" style="flex:1;height:32px;border:1px solid #ddd;border-radius:4px;padding:0 8px;">
          <option value="music">音乐</option><option value="movie">电影</option><option value="tv">电视剧</option>
        </select>
      </div>
      <input type="file" ref="uploadFileInput" :accept="uploadForm.category==='music'?'.mp3,.wav,.flac,.ogg,.aac,.wma':'.mp4,.mkv,.avi,.mov,.wmv,.flv,.webm'" @change="onUploadFileChange" style="font-size:13px;">
      <input v-model="uploadForm.title" placeholder="标题（必填）" style="height:32px;border:1px solid #ddd;border-radius:4px;padding:0 8px;">
      <input v-model="uploadForm.artist" :placeholder="uploadForm.category==='music'?'歌手（必填）':'导演（必填）'" style="height:32px;border:1px solid #ddd;border-radius:4px;padding:0 8px;">
      <template v-if="uploadForm.category==='music'">
        <input v-model="uploadForm.instrument" placeholder="乐器" style="height:32px;border:1px solid #ddd;border-radius:4px;padding:0 8px;">
        <input v-model="uploadForm.style" placeholder="风格" style="height:32px;border:1px solid #ddd;border-radius:4px;padding:0 8px;">
      </template>
      <template v-if="uploadForm.category==='tv'">
        <div style="display:flex;gap:8px;">
          <input v-model="uploadForm.season" placeholder="季" style="flex:1;height:32px;border:1px solid #ddd;border-radius:4px;padding:0 8px;">
          <input v-model="uploadForm.episode" placeholder="集" style="flex:1;height:32px;border:1px solid #ddd;border-radius:4px;padding:0 8px;">
        </div>
        <input v-model="uploadForm.episode_title" placeholder="分集标题" style="height:32px;border:1px solid #ddd;border-radius:4px;padding:0 8px;">
      </template>
      <template v-if="uploadForm.category!=='music'">
        <div style="display:flex;gap:8px;">
          <input v-model="uploadForm.year" placeholder="年份" style="flex:1;height:32px;border:1px solid #ddd;border-radius:4px;padding:0 8px;">
          <input v-model="uploadForm.genre" placeholder="类型" style="flex:1;height:32px;border:1px solid #ddd;border-radius:4px;padding:0 8px;">
        </div>
      </template>
    </div>
    <template #footer>
      <el-button @click="showUpload=false" :disabled="uploading">取消</el-button>
      <el-button type="primary" @click="doUpload" :disabled="uploading">[[ uploading ? '上传中...' : '上传' ]]</el-button>
    </template>
  </el-dialog>
</div>
<script>
(function(){
  const { createApp, ref, reactive, onMounted } = Vue;
  const { ElMessage } = ElementPlus;
  const app = createApp({
    delimiters: ['[[', ']]'],
    setup(){
      const category = ref('music');
      const keyword = ref('');
      const filterInstrument = ref('');
      const filterStyle = ref('');
      const letters = ref([]);
      const instruments = ref([]);
      const styles = ref([]);
      const selectedLetter = ref('');
      const list = ref([]);
      const currentPage = ref(1);
      const pageSize = ref(20);
      const total = ref(0);
      const audioPlayer = ref(null);
      const videoPlayer = ref(null);
      const playing = ref(false);
      const isVideo = ref(false);
      const currentId = ref(null);
      const currentTitle = ref('');
      const coverUrl = ref('');
      const currentTime = ref('0:00');
      const totalTime = ref('0:00');
      const progressPercent = ref(0);
      const loopMode = ref('顺序');
      const volume = ref(80);
      const muted = ref(false);
      const showUpload = ref(false);
      const uploading = ref(false);
      const uploadForm = reactive({category:'music',title:'',artist:'',instrument:'',style:'',season:'',episode:'',episode_title:'',year:'',genre:''});
      const uploadFileInput = ref(null);
      let playlist = [];

      const player = () => videoPlayer.value || audioPlayer.value;
      const videoExts = ['mp4','mkv','avi','mov','wmv','flv','webm'];

      const switchCategory = () => {
        selectedLetter.value = ''; keyword.value = ''; filterInstrument.value = ''; filterStyle.value = '';
        currentId.value = null; playing.value = false; coverUrl.value = ''; isVideo.value = (category.value !== 'music');
        loadFilters(); loadList(1);
      };

      const loadFilters = async () => {
        const r1 = await axios.get('/tools/api/media/letters/', { params: { category: category.value } });
        if (r1.data.code===0) letters.value = r1.data.data||[];
        if (category.value === 'music') {
          const r2 = await axios.get('/tools/api/media/instruments/');
          if (r2.data.code===0) instruments.value = r2.data.data||[];
          const r3 = await axios.get('/tools/api/media/styles/');
          if (r3.data.code===0) styles.value = r3.data.data||[];
        }
      };

      const loadList = async (page) => {
        const p = typeof page === 'number' ? page : 1;
        const params = { page: p, pageSize: pageSize.value, category: category.value, letter: selectedLetter.value };
        if (keyword.value) params.keyword = keyword.value;
        if (filterInstrument.value) params.instrument = filterInstrument.value;
        if (filterStyle.value) params.style = filterStyle.value;
        const r = await axios.get('/tools/api/media/list/', { params });
        if (r.data.code===0) {
          list.value = r.data.data||[]; total.value = r.data.total||0; currentPage.value = p;
          playlist = [...list.value];
        }
      };

      const search = () => { selectedLetter.value = ''; loadList(1); };
      const selectLetter = (l) => { selectedLetter.value = l; keyword.value = ''; loadList(1); };
      const onPageChange = (p) => loadList(p);
      const onSizeChange = (s) => { pageSize.value = s; loadList(1); };

      const play = (r) => {
        currentId.value = r.ID;
        currentTitle.value = (r.Artist || r.Director || '') + ' - ' + r.Title;
        isVideo.value = videoExts.includes((r.MediaType || '').toLowerCase());
        coverUrl.value = category.value === 'music' ? '/tools/api/media/cover/?id=' + r.ID + '&category=' + category.value : '';
        const p = player(); if (p) { p.src = '/tools/api/media/play/?id=' + r.ID + '&category=' + category.value; p.play(); playing.value = true; }
      };
      const togglePlay = () => { const p = player(); if (!p || !p.src) return; if (playing.value) { p.pause(); playing.value = false; } else { p.play(); playing.value = true; } };
      const prev = () => { if (!playlist.length) return; const idx = playlist.findIndex(r=>r.ID===currentId.value); play(playlist[idx<=0?playlist.length-1:idx-1]); };
      const next = () => { if (!playlist.length) return; if (loopMode.value==='随机') { play(playlist[Math.floor(Math.random()*playlist.length)]); return; } const idx = playlist.findIndex(r=>r.ID===currentId.value); play(playlist[idx>=playlist.length-1?0:idx+1]); };
      const onEnded = () => { if (loopMode.value==='单曲') { player().play(); return; } next(); };
      const toggleLoop = () => { loopMode.value = loopMode.value==='顺序'?'单曲': loopMode.value==='单曲'?'随机':'顺序'; };
      const onTimeUpdate = () => { const p = player(); if (!p) return; const ct = p.currentTime, dur = p.duration||0; currentTime.value = formatSeconds(ct); progressPercent.value = dur?(ct/dur*100):0; };
      const onLoaded = () => { totalTime.value = formatSeconds(player().duration||0); };
      const seek = (e) => { const rect = e.target.getBoundingClientRect(); player().currentTime = (player().duration||0)*(e.clientX-rect.left)/rect.width; };
      const setVolume = () => { player().volume = volume.value/100; muted.value = false; };
      const toggleMute = () => { muted.value = !muted.value; player().volume = muted.value?0:volume.value/100; };
      const formatSeconds = (s) => { const m=Math.floor(s/60), sec=Math.floor(s%60); return m+':'+String(sec).padStart(2,'0'); };
      const formatDuration = (s) => formatSeconds(s||0);

      const resetUpload = () => { uploadForm.category = category.value; ['title','artist','instrument','style','season','episode','episode_title','year','genre'].forEach(k => uploadForm[k] = ''); };
      const onUploadFileChange = (e) => { const file = e.target.files?.[0]; if (!file) return; const name = file.name.replace(/\.\w+$/i, ''); if (name.includes(' - ')) { const parts = name.split(' - '); if (!uploadForm.artist) uploadForm.artist = parts[0].trim(); if (!uploadForm.title) uploadForm.title = parts.slice(1).join(' - ').trim(); } else { if (!uploadForm.title) uploadForm.title = name; } };
      const doUpload = async () => {
        const file = uploadFileInput.value?.files?.[0]; if (!file) { ElMessage.warning('请选择文件'); return; }
        if (!uploadForm.title.trim()) { ElMessage.warning('请输入标题'); return; }
        if (!uploadForm.artist.trim()) { ElMessage.warning(uploadForm.category==='music'?'请输入歌手':'请输入导演'); return; }
        uploading.value = true;
        try {
          const fd = new FormData(); fd.append('file', file); fd.append('category', uploadForm.category); fd.append('title', uploadForm.title); fd.append('artist', uploadForm.artist);
          if (uploadForm.category === 'music') { fd.append('instrument', uploadForm.instrument); fd.append('style', uploadForm.style); }
          if (uploadForm.category === 'tv') { fd.append('season', uploadForm.season); fd.append('episode', uploadForm.episode); fd.append('episode_title', uploadForm.episode_title); }
          if (uploadForm.category !== 'music') { fd.append('year', uploadForm.year); fd.append('genre', uploadForm.genre); }
          const r = await axios.post('/tools/api/media/upload/', fd); ElMessage[r.data.code===0?'success':'error'](r.data.msg);
          if (r.data.code===0) { showUpload.value = false; loadList(1); }
        } finally { uploading.value = false; }
      };

      onMounted(() => { loadFilters(); loadList(1); });
      return { category, keyword, filterInstrument, filterStyle, letters, instruments, styles, selectedLetter, list, currentPage, pageSize, total,
               audioPlayer, videoPlayer, playing, isVideo, currentId, currentTitle, coverUrl, currentTime, totalTime, progressPercent, loopMode, volume, muted,
               switchCategory, search, selectLetter, play, togglePlay, prev, next, onEnded, toggleLoop, onPageChange, onSizeChange,
               onTimeUpdate, onLoaded, seek, setVolume, toggleMute, formatDuration,
               showUpload, uploading, uploadForm, uploadFileInput, resetUpload, onUploadFileChange, doUpload };
    }
  });
  app.use(ElementPlus, { locale: ElementPlusLocaleZhCn }).mount('#app');
})();
</script>
</body>
</html>
